<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="1970~2025년 한국 역사학 논문 제목의 멀리서 읽기 — 한영 통합 발표자료"
    />
    <title>과거를 다루는 논문에서 현재를 읽다</title>
    <style>
:root {
  --canvas: #ffffff;
  --ink: #09111c;
  --muted: #5f6975;
  --panel: #e8edf2;
  --panel-2: #f3f6f8;
  --rule: #aeb8c3;
  --accent: #315a7d;
  --accent-strong: #0b2a4a;
  --accent-deep: #061a30;
  --danger-muted: #717984;
  --slide-w: 1280px;
  --slide-h: 720px;
  --deck-scale: 0.8;
  --font:
    Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic",
    "Segoe UI", Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  background: #dce2e8;
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

body.render-mode {
  background: var(--canvas);
}

body.render-mode .stage {
  top: 360px;
  left: 640px;
  box-shadow: none;
}

body.render-mode .deck-toolbar,
body.render-mode .deck-controls {
  display: none;
}

button,
a {
  font: inherit;
}

button {
  color: inherit;
}

.skip-link {
  position: fixed;
  z-index: 100;
  top: 8px;
  left: 8px;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  transform: translateY(-140%);
}

.skip-link:focus {
  transform: none;
}

/* Language landing */
.language-landing {
  display: grid;
  place-items: center;
  overflow: auto;
  background: var(--canvas);
}

.language-panel {
  width: min(1040px, calc(100vw - 64px));
  padding: 60px 0;
}

.language-panel h1 {
  margin: 24px 0 18px;
  font-size: clamp(48px, 6vw, 84px);
  line-height: 0.98;
  letter-spacing: -0.055em;
}

.kicker {
  margin: 0;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.landing-en {
  margin: 0;
  color: var(--muted);
  font-size: 24px;
  letter-spacing: -0.02em;
}

.language-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  margin-top: 76px;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}

.language-choice {
  display: flex;
  align-items: center;
  gap: 24px;
  min-height: 132px;
  padding: 24px;
  color: var(--ink);
  text-decoration: none;
}

.language-choice + .language-choice {
  border-left: 1px solid var(--ink);
}

.language-choice:hover,
.language-choice:focus-visible {
  background: var(--panel-2);
  outline: 3px solid var(--accent-strong);
  outline-offset: -3px;
}

.language-code {
  display: grid;
  width: 64px;
  height: 64px;
  place-items: center;
  background: var(--ink);
  color: #fff;
  font-weight: 800;
}

.language-choice strong,
.language-choice small {
  display: block;
}

.language-choice strong {
  font-size: 24px;
}

.language-choice small {
  margin-top: 6px;
  color: var(--muted);
}

.landing-help {
  margin: 22px 0 0;
  color: var(--muted);
  font-size: 14px;
}

/* Deck chrome */
.stage {
  position: fixed;
  z-index: 1;
  top: 50%;
  left: 50%;
  width: var(--slide-w);
  height: var(--slide-h);
  overflow: hidden;
  background: var(--canvas);
  box-shadow: 0 24px 90px rgba(0, 0, 0, 0.16);
  transform: translate(-50%, -50%) scale(var(--deck-scale));
  transform-origin: center;
}

.deck-toolbar,
.deck-controls {
  position: fixed;
  z-index: 30;
  display: flex;
  align-items: center;
}

.deck-toolbar {
  top: 14px;
  right: 18px;
  left: 18px;
  justify-content: space-between;
}

.deck-home,
.toolbar-actions a,
.toolbar-actions button,
.deck-controls button {
  border: 0;
  background: rgba(255, 255, 255, 0.92);
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}

.deck-home {
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.1em;
}

.toolbar-actions {
  display: flex;
  gap: 2px;
}

.toolbar-actions a,
.toolbar-actions button {
  padding: 8px 11px;
  font-size: 12px;
  font-weight: 700;
}

.toolbar-actions a:hover,
.toolbar-actions button:hover,
.toolbar-actions a:focus-visible,
.toolbar-actions button:focus-visible,
.deck-controls button:hover,
.deck-controls button:focus-visible {
  background: var(--ink);
  color: #fff;
  outline: none;
}

.deck-controls {
  right: 18px;
  bottom: 14px;
  left: 18px;
  justify-content: center;
  gap: 12px;
  pointer-events: none;
}

.deck-controls > * {
  pointer-events: auto;
}

.deck-controls button {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border-radius: 50%;
  font-size: 18px;
}

.progress-track {
  width: min(360px, 36vw);
  height: 3px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.16);
}

.progress-track span {
  display: block;
  width: 0;
  height: 100%;
  background: var(--accent-strong);
  transition: width 220ms ease;
}

.slide-counter {
  min-width: 48px;
  color: #454a51;
  font-size: 12px;
  font-weight: 800;
  text-align: center;
}

/* Slide base */
.slide {
  position: relative;
  width: var(--slide-w);
  height: var(--slide-h);
  overflow: hidden;
  padding: 44px 54px 42px;
  background: var(--canvas);
}

.slide::after {
  position: absolute;
  right: 54px;
  bottom: 20px;
  width: 40px;
  border-top: 2px solid var(--accent-strong);
  content: "";
}

.slide-header {
  position: relative;
  z-index: 3;
}

.eyebrow {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.15em;
}

.slide-title {
  max-width: 1172px;
  margin: 0;
  font-size: 42px;
  font-weight: 760;
  line-height: 1.08;
  letter-spacing: -0.045em;
}

.slide-title em,
.slide em {
  color: var(--accent-strong);
  font-style: normal;
}

.slide-body,
.slide-visual {
  position: relative;
  z-index: 2;
}

.slide-footer {
  position: absolute;
  z-index: 8;
  right: 54px;
  bottom: 20px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  transform: translateX(-50px);
}

.takeaway {
  margin: 0;
  font-size: 22px;
  line-height: 1.4;
  letter-spacing: -0.025em;
}

.micro-note,
.caution,
.unit-label {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.caution {
  padding-left: 12px;
  border-left: 3px solid var(--rule);
}

.deck-definition {
  margin: 18px 0 0;
  color: #333941;
  font-size: 18px;
  line-height: 1.45;
}

/* Cover */
.layout-cover {
  padding: 48px 54px;
}

.layout-cover .slide-title {
  width: 660px;
  margin-top: 108px;
  font-size: 67px;
  line-height: 0.98;
}

body[data-lang="en"] .layout-cover .slide-title {
  width: 690px;
  font-size: 60px;
  line-height: 1;
}

.layout-cover .cover-subtitle {
  width: 590px;
  margin: 28px 0 0;
  color: var(--muted);
  font-size: 20px;
}

.layout-cover .slide-body {
  position: static;
}

.layout-cover .cover-thesis {
  position: absolute;
  top: 540px;
  left: 54px;
  width: 590px;
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.025em;
}

body[data-lang="en"] .layout-cover .cover-thesis {
  top: 540px;
}

.layout-cover .slide-visual {
  position: absolute;
  top: 0;
  right: 0;
  width: 505px;
  height: 720px;
  background: var(--panel-2);
  border-left: 1px solid var(--rule);
}

.word-field {
  position: absolute;
  inset: 46px 38px;
}

.word-field span {
  position: absolute;
  top: var(--y);
  left: var(--x);
  color: #15181d;
  font-size: calc(30px * var(--s));
  font-weight: 760;
  letter-spacing: -0.05em;
  white-space: nowrap;
}

.word-field span:nth-child(4),
.word-field span:nth-child(6),
.word-field span:nth-child(8) {
  color: var(--accent-strong);
}

.word-field-en span {
  font-size: calc(27px * var(--s));
}

/* Research question */
.layout-split-claim .slide-body {
  margin-top: 52px;
}

.question-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 344px;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}

.question-pair section {
  position: relative;
  padding: 48px 38px;
}

.question-pair section + section {
  border-left: 1px solid var(--ink);
  background: var(--panel-2);
}

.question-pair p {
  margin: 0 0 24px;
  color: var(--muted);
  font-size: 17px;
}

.question-pair strong {
  display: block;
  font-size: 38px;
  line-height: 1.16;
  letter-spacing: -0.04em;
}

.question-index {
  position: absolute;
  top: 18px;
  right: 24px;
  color: var(--accent-strong);
  font-size: 14px;
  font-weight: 900;
}

.bottom-question {
  margin: 25px 0 0;
  font-size: 23px;
  line-height: 1.35;
  text-align: center;
}

/* Corpus */
.layout-corpus .slide-body {
  margin-top: 52px;
}

.metric-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}

.metric {
  min-height: 158px;
  padding: 28px 26px 24px;
}

.metric + .metric {
  border-left: 1px solid var(--ink);
}

.metric strong,
.metric span {
  display: block;
}

.metric strong {
  font-size: 46px;
  letter-spacing: -0.045em;
}

.metric span {
  margin-top: 12px;
  color: var(--muted);
  font-size: 16px;
}

.metric-muted {
  color: var(--danger-muted);
}

.metric-accent {
  background: var(--accent-strong);
  color: #fff;
}

.metric-accent span {
  color: rgba(255, 255, 255, 0.78);
}

.clarifier {
  margin: 25px 0 0;
  font-size: 19px;
  line-height: 1.5;
}

.layout-corpus .slide-visual {
  position: absolute;
  right: 54px;
  bottom: 74px;
  left: 54px;
}

.pipeline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 58px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.pipeline span {
  font-size: 15px;
  font-weight: 800;
}

.pipeline i {
  color: var(--accent-strong);
  font-style: normal;
}

.audit-line {
  display: flex;
  justify-content: flex-end;
  gap: 26px;
  margin-top: 14px;
  color: var(--muted);
  font-size: 13px;
}

.audit-line b {
  color: var(--ink);
}

/* Volume */
.layout-volume .slide-body {
  position: absolute;
  top: 168px;
  left: 54px;
  width: 500px;
  height: 460px;
}

.volume-chart {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 82px;
  height: 420px;
  padding: 0 36px 28px;
  border-bottom: 1px solid var(--ink);
}

.volume-column {
  display: grid;
  grid-template-rows: 34px 300px 24px;
  align-items: end;
  width: 145px;
  height: 100%;
  text-align: center;
}

.volume-value {
  align-self: center;
  font-size: 23px;
  font-weight: 850;
}

.volume-bar {
  width: 100%;
  height: var(--h);
  min-height: 18px;
  background: var(--ink);
}

.accent-bar {
  background: var(--accent-strong);
}

.volume-label {
  padding-top: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.layout-volume .slide-visual {
  position: absolute;
  top: 166px;
  right: 54px;
  width: 590px;
}

.method-list {
  border-top: 1px solid var(--ink);
}

.method-list p {
  display: flex;
  align-items: center;
  min-height: 64px;
  margin: 0;
  border-bottom: 1px solid var(--rule);
  font-size: 21px;
  font-weight: 700;
}

.method-list span {
  width: 54px;
  color: var(--accent-strong);
  font-size: 13px;
  font-weight: 900;
}

.formula {
  margin: 30px 0 0;
  padding: 20px 24px;
  background: var(--panel-2);
  font-size: 18px;
}

/* Title density */
.layout-title-density .slide-body {
  margin-top: 50px;
}

.dual-change {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}

.dual-change section {
  min-height: 230px;
  padding: 28px 34px;
}

.dual-change section + section {
  border-left: 1px solid var(--ink);
}

.dual-change section > span {
  color: var(--muted);
  font-size: 16px;
  font-weight: 700;
}

.change-values {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-top: 24px;
}

.change-values b,
.change-values strong {
  font-size: 31px;
  letter-spacing: -0.04em;
}

.change-values strong {
  color: var(--accent-strong);
}

.change-values i {
  color: var(--rule);
  font-style: normal;
}

.change-track {
  position: relative;
  height: 8px;
  margin-top: 28px;
  background: var(--panel);
}

.change-track span,
.change-track b {
  position: absolute;
  top: 0;
  height: 8px;
}

.change-track span {
  left: 0;
  width: var(--w);
  background: var(--ink);
}

.change-track b {
  right: 0;
  width: calc(100% - var(--w) - 10px);
  background: var(--accent-strong);
}

.dual-change small {
  display: block;
  margin-top: 15px;
  color: var(--accent-strong);
  font-size: 16px;
  font-weight: 900;
}

.layout-title-density .slide-visual {
  margin-top: 36px;
}

.grammar-shift {
  display: grid;
  grid-template-columns: 1fr 44px 1.35fr;
  align-items: center;
}

.grammar-shift > div {
  padding: 17px 20px;
  border: 1px solid var(--rule);
}

.grammar-shift > i {
  color: var(--accent-strong);
  font-style: normal;
  text-align: center;
}

.grammar-shift span,
.grammar-shift b {
  display: block;
}

.grammar-shift span {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 13px;
}

.grammar-shift b {
  font-size: 18px;
}

.grammar-rich {
  border-color: var(--accent-strong) !important;
}

.layout-title-density .takeaway {
  margin-top: 20px;
  text-align: center;
}

/* Timeline */
.layout-timeline .slide-body {
  margin-top: 12px;
}

.era-timeline {
  position: relative;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-top: 60px;
  padding-top: 24px;
}

.era-timeline::before {
  position: absolute;
  top: 4px;
  right: 5%;
  left: 5%;
  border-top: 2px solid var(--ink);
  content: "";
}

.era-timeline > div {
  position: relative;
  min-height: 130px;
  padding: 0 13px;
  border-right: 1px solid var(--rule);
}

.era-timeline > div:last-child {
  border-right: 0;
}

.era-timeline > div::before {
  position: absolute;
  top: -27px;
  left: 13px;
  width: 10px;
  height: 10px;
  background: var(--ink);
  border-radius: 50%;
  content: "";
}

.era-timeline > div:nth-child(4)::before,
.era-timeline > div:nth-child(5)::before,
.era-timeline > div:nth-child(7)::before {
  background: var(--accent-strong);
}

.era-timeline b,
.era-timeline span {
  display: block;
}

.era-timeline b {
  margin-bottom: 13px;
  color: var(--accent-strong);
  font-size: 14px;
}

.era-timeline span {
  font-size: 17px;
  font-weight: 760;
  line-height: 1.45;
  letter-spacing: -0.025em;
}

.era-timeline-en span {
  font-size: 14px;
}

.layout-timeline .slide-visual {
  position: absolute;
  right: 54px;
  bottom: 58px;
  left: 54px;
}

.three-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}

.three-stats span {
  padding: 16px 20px;
  color: var(--muted);
  font-size: 14px;
  text-align: center;
}

.three-stats span + span {
  border-left: 1px solid var(--rule);
}

.three-stats b {
  margin-right: 8px;
  color: var(--ink);
  font-size: 24px;
}

.layout-timeline .micro-note {
  margin: 12px 0 0;
  text-align: center;
}

/* 1970s grammar */
.layout-grammar-era .slide-body {
  margin-top: 55px;
}

.token-line {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.token-line span {
  padding: 10px 16px;
  background: var(--panel);
  font-weight: 800;
}

.token-line-large span {
  padding: 14px 23px;
  font-size: 24px;
}

.token-line-en span {
  font-size: 17px;
}

.grammar-equation {
  display: grid;
  grid-template-columns: 1fr 80px 1fr;
  align-items: center;
  margin-top: 52px;
  padding: 34px 0;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}

.grammar-equation > div {
  text-align: center;
}

.grammar-equation small,
.grammar-equation b {
  display: block;
}

.grammar-equation small {
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 15px;
}

.grammar-equation b {
  font-size: 28px;
}

.grammar-equation > i {
  color: var(--accent-strong);
  font-size: 32px;
  font-style: normal;
  text-align: center;
}

.layout-grammar-era .slide-visual {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-top: 28px;
}

.era-claim {
  margin: 0;
  font-size: 26px;
  font-weight: 680;
  line-height: 1.35;
  letter-spacing: -0.035em;
}

.layout-grammar-era .caution {
  width: 260px;
  margin: 0;
}

/* Rise */
.layout-rise .slide-body {
  position: absolute;
  top: 180px;
  left: 54px;
  width: 660px;
}

.rise-chart {
  border-top: 1px solid var(--ink);
}

.rise-chart > div {
  display: grid;
  grid-template-columns: 82px 1fr 112px;
  align-items: center;
  min-height: 61px;
  border-bottom: 1px solid var(--rule);
}

.rise-chart > div > span {
  font-size: 18px;
  font-weight: 800;
}

.rise-chart > div > strong {
  font-size: 14px;
  text-align: right;
}

.rise-chart i {
  position: relative;
  display: block;
  height: 7px;
  margin: 0 15px;
  background: var(--panel);
}

.rise-chart i b {
  position: absolute;
  top: 0;
  left: var(--start);
  width: calc(var(--end) - var(--start));
  height: 7px;
  background: var(--accent-strong);
}

.rise-chart i b::before,
.rise-chart i b::after {
  position: absolute;
  top: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  content: "";
  transform: translateY(-50%);
}

.rise-chart i b::before {
  left: -5px;
  background: var(--ink);
}

.rise-chart i b::after {
  right: -5px;
  background: var(--accent-strong);
}

.unit-label {
  display: block;
  margin-top: 9px;
  text-align: right;
}

.layout-rise .slide-visual {
  position: absolute;
  top: 190px;
  right: 54px;
  width: 460px;
}

.co-pairs {
  border-top: 1px solid var(--ink);
}

.co-pairs span {
  display: block;
  padding: 20px 10px;
  border-bottom: 1px solid var(--rule);
  font-size: 23px;
  font-weight: 800;
  text-align: center;
}

.co-pairs i {
  margin: 0 20px;
  color: var(--accent-strong);
  font-style: normal;
}

.layout-rise .takeaway {

}

}

.interaction-hint {
  position: fixed;
  z-index: 30;
  bottom: 18px;

.interaction-hint::before {

  height: 7px;
  background: var(--accent-strong);
  border-radius: 50%;
  content: "";
  animation: hint-pulse 1.8s ease-in-out infinite;
}

.reveal-item {
  transition:
    opacity 260ms ease,
    transform 260ms ease,
    filter 260ms ease;
}

.reveal-item.is-pending {
  opacity: 0.18;
  filter: grayscale(0.7);
  transform: translateY(10px);
}

.reveal-item.is-revealed {
  opacity: 1;
  filter: none;
  transform: none;
}

.era-timeline > div,
.concept-steps > section,
.validation-ladder > span,
.mini-network,
.metric,
.question-pair > section {

.era-timeline > div:hover,

.era-timeline > div.is-active {

.timeline-detail,

.concept-steps > section:hover,
.concept-steps > section:focus-visible,

}

.concept-steps > section {

    transform 180ms ease,
    outline-color 180ms ease,
    background 180ms ease;
}

.validation-ladder > span:hover,
.validation-ladder > span:focus-visible,
.validation-ladder > span.is-active {

  color: var(--accent-deep);
}

.mini-network:hover,
.mini-network:focus-visible,
.mini-network.is-active {

}

.mini-network.is-active .edge {
  height: 4px;
  background: var(--accent-deep);
}

.mini-network.is-active .node {
  border-color: var(--accent-deep);
  color: var(--accent-deep);
}

.interactive-mode {
  position: absolute;
  z-index: 10;
  top: 112px;
  right: 54px;
  display: flex;
  border-bottom: 1px solid var(--rule);
}

.interactive-mode button {
  padding: 7px 12px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 850;
  cursor: pointer;
}

.interactive-mode button[aria-pressed="true"] {
  border-bottom: 3px solid var(--accent-strong);
  color: var(--accent-strong);
}

.layout-volume.is-normalized .volume-column:first-child .volume-bar {
  height: 74%;
}

.layout-volume.is-normalized .volume-column:last-child .volume-bar {
  height: 74%;
}

.layout-volume.is-normalized .volume-value {
  font-size: 0;
}

.layout-volume.is-normalized .volume-column:first-child .volume-value::after,
.layout-volume.is-normalized .volume-column:last-child .volume-value::after {
  font-size: 20px;
  content: "1,000 titles";
}

body[data-lang="ko"] .layout-volume.is-normalized .volume-column:first-child .volume-value::after,
body[data-lang="ko"] .layout-volume.is-normalized .volume-column:last-child .volume-value::after {
  content: "1,000편";
}

.layout-volume.is-normalized .formula {
  background: var(--accent-strong);
  color: #fff;
}

.slide-enter .volume-bar {
  animation: bar-rise 620ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
  transform-origin: bottom;
}

.slide-enter .rise-chart i b,
.slide-enter .change-track span,
.slide-enter .change-track b {
  animation: line-grow 660ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
  transform-origin: left center;
}

body.is-language-changing .stage {
  animation: language-swap 260ms ease both;
}

@keyframes bar-rise {
  from {
    transform: scaleY(0);
  }
  to {
    transform: scaleY(1);
  }
}

@keyframes line-grow {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}

@keyframes language-swap {
  0% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(var(--deck-scale));
  }
  45% {
    opacity: 0.18;
    transform: translate(-50%, -50%) scale(calc(var(--deck-scale) * 0.985));
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(var(--deck-scale));
  }
}

@keyframes hint-pulse {
  0%,
  100% {
    opacity: 0.3;
    transform: scale(0.8);
  }
  50% {
    opacity: 1;
    transform: scale(1.2);
  }
}

/* Transitions */
.slide-enter {
  animation: slide-enter 240ms ease both;
}

@keyframes slide-enter {
  from {
    opacity: 0;
    transform: translateX(18px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

@media (max-width: 700px) {
  .deck-toolbar {
    right: 8px;
    left: 8px;
  }

  .deck-home {
    display: none;
  }

  .toolbar-actions {
    margin-left: auto;
  }

  .toolbar-actions a,
  .toolbar-actions button {
    padding: 7px 8px;
    font-size: 11px;
  }

  .language-choices {
    grid-template-columns: 1fr;
  }

  .language-choice + .language-choice {
    border-top: 1px solid var(--ink);
    border-left: 0;
  }
}

/* 2026 editorial polish — archival atlas */
:root {
  --canvas: #fbfaf6;
  --ink: #17212b;
  --muted: #68737f;
  --panel: #e7ecec;
  --panel-2: #f2f0e9;
  --rule: #c8c3b8;
  --accent: #176b67;
  --accent-strong: #173957;
  --accent-deep: #0d2438;
  --brass: #b78a3b;
  --brass-soft: #e8dcc3;
  --navy-wash: #e9eef2;
  --teal-wash: #e7f0ed;
}

body {
  background:
    radial-gradient(circle at 12% 0%, rgba(183, 138, 59, 0.12), transparent 28%),
    radial-gradient(circle at 92% 100%, rgba(23, 107, 103, 0.1), transparent 30%),
    #dbe1e3;
}

.stage {
  border: 1px solid rgba(13, 36, 56, 0.16);
  background: var(--canvas);
  box-shadow:
    0 34px 110px rgba(13, 36, 56, 0.18),
    0 4px 16px rgba(13, 36, 56, 0.1);
}

.deck-toolbar {
  top: 16px;
}

.deck-home,
.toolbar-actions a,
.toolbar-actions button,
.deck-controls button {
  border: 1px solid rgba(13, 36, 56, 0.1);
  background: rgba(251, 250, 246, 0.94);
  box-shadow: 0 4px 14px rgba(13, 36, 56, 0.06);
  backdrop-filter: blur(10px);
}

.deck-home {
  border-left: 4px solid var(--brass);
  color: var(--accent-deep);
  letter-spacing: 0.13em;
}

.toolbar-actions {
  gap: 6px;
}

.toolbar-actions a,
.toolbar-actions button {
  border-radius: 2px;
}

.language-toggle {
  border-color: rgba(23, 57, 87, 0.22);
  background: rgba(251, 250, 246, 0.96);

}

.metric:nth-child(2) {

.scope-row,
.formula,
.three-stats,
.pair-stat,
.panel-check {

.change-track span,

.change-track b {

.grammar-shift {

.timeline-detail,
