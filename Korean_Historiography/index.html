        "1981–1985: 기존 연구 형식이 지속되는 가운데 일제하·교과서·정치·운동 언어가 들어왔다.",
        "1986–1990: 노동·농민 같은 집단과 정책·조직·과정이 전면화됐다.",
        "1991–1995: 지역·여성·주민·공간·국제·외교가 새로운 분석 단위가 됐다.",
        "1996–2000: 동아시아·재외 한인·근대성처럼 경계와 전환의 문제가 성장했다.",
        "2001–2005: 과거가 기억·정체성·역사교과서와 맺는 관계가 독립된 질문이 됐다.",
        "2006–2010: 담론·표상·공간·제국·경계를 통해 과거가 구성되는 방식 자체를 분석했다.",
        "2011–2015: 교육·민간인 피해·냉전·네트워크를 통해 역사학이 공공 쟁점과 연결됐다.",
        "2016–2020: 기록·일기·사행·장소가 경험을 미시적으로 복원하는 자료로 부상했다.",
        "2021–2025: 서사·물질·의료·유산·공공역사가 과거의 현재적 사용을 전면에 놓는다.",
      ],
      validation: [
        "논문 수와 제목 길이의 차이를 제거해 상대적 중심성을 비교한다.",
        "5년 급증과 10년 구조 변화가 같은 방향인지 교차 확인한다.",
        "서로 다른 두 시기에 모두 논문을 실은 학술지만 남겨, 새 학술지의 등장 효과를 줄인다.",
        "시기별 논문 수를 작은 쪽에 맞춘 뒤 복원추출을 300번 반복해, 변화 방향이 계속 유지되는지 확인한다.",
        "특정 전문학술지 한 곳이 만든 신호는 집중도 표지로 분리한다.",
        "전체 제외 서지 3,627건 중 1970~2025 일반 연구논문 2,316편을 제거하고 분석을 처음부터 다시 실행한다.",
      ],
      network: [
        "1980년대 후반: 노동·농민은 ‘운동’과, 구조는 ‘성격’과 결합했다.",
        "2000년대: 기억·정체성에서 담론·표상·공간으로 질문이 이어졌다.",
        "2020년대: 공공·역사·서사·자료·함의가 현재적 가치의 묶음을 이룬다.",
      ],
    },
    en: {
      overview: "Overview",
      fullscreen: "Fullscreen",
      hint: "→: advance steps, then next slide · ←: step back · L: switch language",
      raw: "Raw volume",
      normalized: "Same denominator",
      timeline: [
        "1976–1980: Genre labels such as “study” and “examination” accompanied dynasties, figures, and thought.",
        "1981–1985: Established research forms persisted while colonial-period, textbook, political, and movement vocabulary entered.",
        "1986–1990: Labor and peasants emerged alongside policy, organization, and process.",
        "1991–1995: Regions, women, residents, space, diplomacy, and international relations became new analytical units.",
        "1996–2000: East Asia, diaspora, and modernity brought boundaries and transitions into focus.",
        "2001–2005: The relation between the past, memory, identity, textbooks, and records became a question in its own right.",
        "2006–2010: Discourse, representation, space, empire, and boundaries turned the construction of the past into an object of study.",
        "2011–2015: Education, civilian harm, the Cold War, and networks connected scholarship more directly to public issues.",
        "2016–2020: Records, diaries, missions, and places supported finer-grained reconstructions of experience.",
        "2021–2025: Narrative, materiality, medicine, heritage, and public history foreground the present-day uses of the past.",
      ],
      validation: [
        "Normalize publication volume and title length to compare relative centrality.",
        "Cross-check short five-year bursts against slower ten-year structural change.",
        "Retain journals that published in both periods to reduce journal entry and exit effects.",
        "Match both periods to the smaller sample, resample with replacement 300 times, and check whether the direction persists.",
        "Flag signals dominated by one specialist journal rather than treating them as field-wide.",
        "Of 3,627 excluded records, remove 2,316 general research articles from 1970–2025 and rerun every analysis.",
      ],
      network: [
        "Late 1980s: labor and peasants clustered with movement; structure clustered with character.",
        "2000s: questions moved from memory and identity toward discourse, representation, and space.",
        "2020s: public, history, narrative, sources, and implications formed a bundle around present value.",
      ],
    },
  };

  function readHash(total) {
    const parsed = Number.parseInt(location.hash.replace("#", ""), 10);
    if (!Number.isFinite(parsed)) return 0;
    return Math.min(Math.max(parsed - 1, 0), total - 1);
  }

  function stripTags(html) {
    const node = document.createElement("div");
    node.innerHTML = html;
    return node.textContent.trim();
  }

  function slideMarkup(slide, index, animate) {
    return `
      <article
        class="slide layout-${slide.layout}${animate ? " slide-enter" : ""}"
        data-slide="${index + 1}"
        aria-label="${index + 1}. ${stripTags(slide.title)}"
      >
        <header class="slide-header">
          <p class="eyebrow">${slide.eyebrow || ""}</p>
          <h1 class="slide-title">${slide.title}</h1>
        </header>
        <div class="slide-body">${slide.content || ""}</div>
        <div class="slide-visual">${slide.visual || ""}</div>
        ${
          index === 0
            ? `
        <a
          class="cover-qr"
          href="https://littlekg87.github.io/DH2026/Korean_Historiography/DH2026_Historiography_presentation.html#1"
          target="_blank"
          rel="noreferrer"
          aria-label="Open this presentation"
        >
          <img
            src="./DH2026_Historiography_QR.svg"
            width="448"
            height="448"
            alt=""
          />
          <span class="qr-label-ko">발표자료 열기</span>
          <span class="qr-label-en">Open the presentation</span>
        </a>`
            : ""
        }
        <span class="slide-footer" aria-hidden="true">${String(index + 1).padStart(2, "0")}</span>
      </article>
    `;
  }

  function render(animate = true) {
    if (printing) return;
    const slide = deck.slides[current];
    stage.innerHTML = slideMarkup(slide, current, animate);
    counter.value = `${current + 1} / ${deck.slides.length}`;
    progress.style.width = `${((current + 1) / deck.slides.length) * 100}%`;
    history.replaceState(null, "", `#${current + 1}`);
    document.title = `${stripTags(slide.title)} — ${deck.meta.title}`;
    syncLanguageUI();
    installInteractions();
    updateOverviewSelection();
  }

  function goTo(nextIndex, animate = true) {
    current = Math.min(Math.max(nextIndex, 0), deck.slides.length - 1);
    render(animate);
  }

  function next() {
    goTo(current + 1);
  }

  function previous() {
    goTo(current - 1);
  }

  function setLanguage(nextLang) {
    if (!window.DECKS[nextLang] || nextLang === currentLang) return;
    document.body.classList.add("is-language-changing");
    currentLang = nextLang;
    deck = window.DECKS[currentLang];
    localStorage.setItem("history-deck-lang", currentLang);
    document.documentElement.lang = currentLang;
    document.body.dataset.lang = currentLang;
    buildOverview();
    render(false);
    window.setTimeout(() => document.body.classList.remove("is-language-changing"), 280);
  }

  function syncLanguageUI() {
    languageButtons.forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.langChoice === currentLang));
    });
    const copy = interactiveCopy[currentLang];
    interactionHint.textContent = copy.hint;
    const overviewButton = document.querySelector('[data-action="overview"]');
    const fullscreenButton = document.querySelector('[data-action="fullscreen"]');
    if (overviewButton) overviewButton.textContent = copy.overview;
    if (fullscreenButton) fullscreenButton.textContent = copy.fullscreen;
  }

  function setupReveals(slideElement) {
    revealItems = [
      ...slideElement.querySelectorAll(
        [
          ".question-pair > section",
          ".source-identity > section",
          ".source-record",
          ".metric-row > .metric",
          ".title-examples > article",
          ".era-paper-examples > article",
          ".era-timeline > div",
          ".token-line > span",
          ".decade-phase > section",
          ".rise-chart > div",
          ".evidence-chart > .stat-row",
          ".scale-rays > span",
          ".concept-steps > section",
          ".three-columns > section",
          ".joseon-compare > section",
          ".confidence-strip > span",
          ".validation-ladder > span",
          ".mini-network",
          ".robust-funnel > div",
          ".synthesis-flow > section",
        ].join(","),
      ),
    ];
    revealCursor = 0;
    revealItems.forEach((item, index) => {
      item.classList.add("reveal-item");
      item.classList.toggle("is-revealed", index === 0);
      item.classList.toggle("is-pending", index !== 0);
      item.tabIndex = 0;
    });
    revealCursor = revealItems.length ? 1 : 0;

    if (revealItems.length > 1) {
      const indicator = document.createElement("div");
      indicator.className = "step-indicator";
      indicator.setAttribute("aria-live", "polite");
      indicator.innerHTML = `
        <span class="step-label"></span>
        <div>${revealItems.map(() => "<i></i>").join("")}</div>
      `;
      slideElement.appendChild(indicator);
      updateStepIndicator();
    }
  }

  function updateStepIndicator() {
    const indicator = stage.querySelector(".step-indicator");
    if (!indicator) return;
    const currentStep = Math.min(Math.max(revealCursor, 1), revealItems.length);
    const label = currentLang === "ko" ? "단계" : "step";
    indicator.querySelector(".step-label").textContent = `${label} ${currentStep} / ${revealItems.length}`;
    indicator.querySelectorAll("i").forEach((dot, index) => {
      dot.classList.toggle("is-complete", index < revealCursor);
      dot.classList.toggle("is-current", index === currentStep - 1);
    });
  }

  function revealNext() {
    if (revealCursor >= revealItems.length) return false;
    const item = revealItems[revealCursor];
    revealItem(item);
    activateInteractiveItem(item);
    return true;
  }

  function revealItem(item) {
    item.classList.remove("is-pending");
    item.classList.add("is-revealed");
    const index = revealItems.indexOf(item);
    if (index >= revealCursor) revealCursor = index + 1;
    updateStepIndicator();
  }

  function setVolumeMode(mode) {
    const slide = stage.querySelector(".layout-volume");
    if (!slide) return false;
    const normalized = mode === "normalized";
    slide.classList.toggle("is-normalized", normalized);
    slide.querySelectorAll("[data-volume-mode]").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.volumeMode === mode));
    });
    return true;
  }

  function activateInteractiveItem(item) {
    if (!item) return;

    if (item.matches(".era-timeline > div")) {
      activateSibling(item, ".era-timeline");
      const detailIndex = Number(item.dataset.detailIndex);
      const detail = stage.querySelector(".timeline-detail");
      if (detail && Number.isFinite(detailIndex)) detail.textContent = interactiveCopy[currentLang].timeline[detailIndex];
    } else if (item.matches(".validation-ladder > span")) {
      activateSibling(item, ".validation-ladder");
      const index = [...item.parentElement.children].indexOf(item);
      const detail = stage.querySelector(".validation-detail");
      if (detail) detail.textContent = interactiveCopy[currentLang].validation[index];
    } else if (item.matches(".mini-network")) {
      activateSibling(item, ".network-row");
      const index = [...item.parentElement.children].indexOf(item);
      const detail = stage.querySelector(".network-detail");
      if (detail) detail.textContent = interactiveCopy[currentLang].network[index];
    } else if (item.matches(".concept-steps > section")) {
      activateSibling(item, ".concept-steps");
    } else if (item.matches(".title-examples > article")) {
      activateSibling(item, ".title-examples");
    } else if (item.matches(".era-paper-examples > article")) {
      activateSibling(item, ".era-paper-examples");
    } else if (item.matches(".decade-phase > section")) {
      activateSibling(item, ".decade-phase");
    } else if (item.matches(".three-columns > section")) {
      activateSibling(item, ".three-columns");
    } else if (item.matches(".joseon-compare > section")) {
      activateSibling(item, ".joseon-compare");
    } else if (item.matches(".synthesis-flow > section")) {
      activateSibling(item, ".synthesis-flow");
    }
  }

  function advance() {
    if (revealNext()) return;
    const volume = stage.querySelector(".layout-volume");
    if (volume && !volume.classList.contains("is-normalized")) {
      setVolumeMode("normalized");
      return;
    }
    next();
  }

  function retreat() {
    const volume = stage.querySelector(".layout-volume");
    if (volume?.classList.contains("is-normalized")) {
      setVolumeMode("raw");
      return;
    }
    if (revealCursor > 1) {
      const item = revealItems[revealCursor - 1];
      item.classList.remove("is-revealed", "is-active");
      item.classList.add("is-pending");
      revealCursor -= 1;
      activateInteractiveItem(revealItems[revealCursor - 1]);
      updateStepIndicator();
      return;
    }
    previous();
  }

  function installInteractions() {
    const slideElement = stage.querySelector(".slide");
    if (!slideElement) return;
    setupReveals(slideElement);

    if (slideElement.classList.contains("layout-volume")) {
      const copy = interactiveCopy[currentLang];
      const controls = document.createElement("div");
      controls.className = "interactive-mode";
      controls.innerHTML = `
        <button type="button" data-volume-mode="raw" aria-pressed="true">${copy.raw}</button>
        <button type="button" data-volume-mode="normalized" aria-pressed="false">${copy.normalized}</button>
      `;
      slideElement.appendChild(controls);
    }

    const timeline = slideElement.querySelector(".era-timeline");
    if (timeline) {
      const detail = document.createElement("div");
      detail.className = "timeline-detail";
      const firstIndex = Number(timeline.children[0]?.dataset.detailIndex);
      detail.textContent = interactiveCopy[currentLang].timeline[Number.isFinite(firstIndex) ? firstIndex : 0];
      timeline.insertAdjacentElement("afterend", detail);
      timeline.children[0]?.classList.add("is-active");
    }

    const validation = slideElement.querySelector(".validation-ladder");
    if (validation) {
      const detail = document.createElement("div");
      detail.className = "validation-detail";
      detail.textContent = interactiveCopy[currentLang].validation[0];
      validation.insertAdjacentElement("afterend", detail);
      validation.children[0]?.classList.add("is-active");
    }

    const networks = slideElement.querySelector(".network-row");
    if (networks) {
      const detail = document.createElement("div");
      detail.className = "network-detail";
      detail.textContent = interactiveCopy[currentLang].network[0];
      networks.insertAdjacentElement("afterend", detail);
      networks.children[0]?.classList.add("is-active");
    }
  }

  function activateSibling(target, selector) {
    target.closest(selector)?.querySelectorAll(".is-active").forEach((item) => item.classList.remove("is-active"));
    target.classList.add("is-active");
    revealItem(target);
  }

  function buildOverview() {
    overviewGrid.innerHTML = deck.slides
      .map(
        (slide, index) => `
          <button class="overview-card" type="button" data-overview-slide="${index}">
            <span>${String(index + 1).padStart(2, "0")} · ${slide.eyebrow || ""}</span>
            <strong>${slide.title}</strong>
          </button>
        `,
      )
      .join("");
  }

  function updateOverviewSelection() {
    overviewGrid
      .querySelectorAll(".overview-card")
      .forEach((card, index) => card.toggleAttribute("aria-current", index === current));
  }

  function toggleOverview(force) {
    const nextState =
      typeof force === "boolean"
        ? force
        : overview.getAttribute("aria-hidden") === "true";
    overview.setAttribute("aria-hidden", String(!nextState));
    if (nextState) {
      updateOverviewSelection();
      overviewGrid.querySelector(`[data-overview-slide="${current}"]`)?.focus();
    }
  }

  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_error) {
      /* Browsers can block fullscreen for local files. */
    }
  }

  function resizeStage() {
    if (renderMode) {
      document.documentElement.style.setProperty("--deck-scale", "1");
      return;
    }
    const horizontalMargin = window.innerWidth < 720 ? 12 : 38;
    const verticalMargin = window.innerHeight < 600 ? 42 : 74;
    const scale = Math.min(
      (window.innerWidth - horizontalMargin) / 1280,
      (window.innerHeight - verticalMargin) / 720,
      1.35,
    );
    document.documentElement.style.setProperty("--deck-scale", String(Math.max(scale, 0.18)));
  }

  function onKey(event) {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
    const key = event.key.toLowerCase();
    if (["arrowright", "pagedown", " "].includes(key)) {
      event.preventDefault();
      advance();
    } else if (["arrowleft", "pageup", "backspace"].includes(key)) {
      event.preventDefault();
      retreat();
    } else if (["enter", "arrowdown"].includes(key)) {
      event.preventDefault();
      advance();
    } else if (key === "home") {
      event.preventDefault();
      goTo(0);
    } else if (key === "end") {
      event.preventDefault();
      goTo(deck.slides.length - 1);
    } else if (key === "f") {
      event.preventDefault();
      toggleFullscreen();
    } else if (key === "o") {
      event.preventDefault();
      toggleOverview();
    } else if (key === "l") {
      event.preventDefault();
      setLanguage(currentLang === "ko" ? "en" : "ko");
    } else if (key === "escape") {
      toggleOverview(false);
    }
  }

  document.addEventListener("click", (event) => {
    const languageTarget = event.target.closest("[data-lang-choice]");
    if (languageTarget) setLanguage(languageTarget.dataset.langChoice);

    const actionTarget = event.target.closest("[data-action]");
    if (actionTarget?.dataset.action === "next") advance();
    if (actionTarget?.dataset.action === "previous") retreat();
    if (actionTarget?.dataset.action === "overview") toggleOverview();
    if (actionTarget?.dataset.action === "overview-close") toggleOverview(false);
    if (actionTarget?.dataset.action === "fullscreen") toggleFullscreen();

    const overviewTarget = event.target.closest("[data-overview-slide]");
    if (overviewTarget) {
      goTo(Number(overviewTarget.dataset.overviewSlide));
      toggleOverview(false);
      stage.focus();
    }

    const volumeMode = event.target.closest("[data-volume-mode]");
    if (volumeMode) {
      setVolumeMode(volumeMode.dataset.volumeMode);
    }

    const era = event.target.closest(".era-timeline > div");
    if (era) {
      activateInteractiveItem(era);
    }

    const concept = event.target.closest(".concept-steps > section");
    if (concept) activateInteractiveItem(concept);

    const validation = event.target.closest(".validation-ladder > span");
    if (validation) activateInteractiveItem(validation);

    const network = event.target.closest(".mini-network");
    if (network) activateInteractiveItem(network);

    const revealTarget = event.target.closest(".reveal-item");
    if (revealTarget) revealItem(revealTarget);
  });

  document.addEventListener("keydown", onKey);
  window.addEventListener("resize", resizeStage);
  window.addEventListener("hashchange", () => {
    const requested = readHash(deck.slides.length);
    if (requested !== current) goTo(requested, false);
  });

  stage.addEventListener(
    "touchstart",
    (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    },
    { passive: true },
  );

  stage.addEventListener(
    "touchend",
    (event) => {
      if (touchStartX === null || touchStartY === null) return;
      const touch = event.changedTouches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;
      touchStartX = null;
      touchStartY = null;
      if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) {
        if (deltaX < 0) advance();
        else retreat();
      }
    },
    { passive: true },
  );

  window.addEventListener("beforeprint", () => {
    printing = true;
    stage.classList.add("print-mode");
    stage.innerHTML = deck.slides.map((slide, index) => slideMarkup(slide, index, false)).join("");
  });

  window.addEventListener("afterprint", () => {
    printing = false;
    stage.classList.remove("print-mode");
    render(false);
  });

  document.documentElement.lang = currentLang;
  document.body.dataset.lang = currentLang;
  buildOverview();
  resizeStage();
  render(false);
})();

    </script>
  </body>
</html>
