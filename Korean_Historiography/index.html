      window.DECKS = {"ko":{"meta":{"title":"과거를 다루는 논문에서 현재를 읽다"},"slides":[{"layout":"cover","eyebrow":"DISTANT READING · 1970–2025","title":"A Distant Reading of the<br><em>Bulletin of Korean<br>Historical Studies:<\/em><br>Temporal Consciousness in Korean<br>Historiographical Publications","content":"\n          <p class=\"cover-subtitle\">한국 역사학 논문 제목 11만여 편의 멀리서 읽기<\/p>\n          <p class=\"cover-thesis\">논문 한 편은 과거를 말하지만,<br>논문 전체는 현재의 질문을 말한다.<\/p>\n        ","visual":"\n          <div class=\"word-field\" aria-hidden=\"true\">\n            <span style=\"--x:5%;--y:8%;--s:1.0\">연구<\/span>\n            <span style=\"--x:44%;--y:5%;--s:.72\">고찰<\/span>\n            <span style=\"--x:18%;--y:26%;--s:.86\">왕조<\/span>\n            <span style=\"--x:54%;--y:24%;--s:1.06\">지역<\/span>\n            <span style=\"--x:2%;--y:47%;--s:.8\">여성<\/span>\n            <span style=\"--x:38%;--y:44%;--s:1.15\">기억<\/span>\n            <span style=\"--x:10%;--y:67%;--s:.94\">표상<\/span>\n            <span style=\"--x:55%;--y:64%;--s:1.26\">서사<\/span>\n            <span style=\"--x:24%;--y:86%;--s:.76\">공공역사<\/span>\n          <\/div>\n        "},{"layout":"split-claim","eyebrow":"RESEARCH QUESTION","title":"논문 전체는 <em>현재의 질문<\/em>을 말한다","content":"\n          <div class=\"question-pair\">\n            <section>\n              <span class=\"question-index\">01<\/span>\n              <p>한 편의 논문<\/p>\n              <strong>“과거에 무엇이<br>있었는가?”<\/strong>\n            <\/section>\n            <section>\n              <span class=\"question-index\">11만+<\/span>\n              <p>논문의 집합<\/p>\n              <strong>“역사학자들은 주로<br>어떤 문제에 관심을 갖는가?”<\/strong>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <p class=\"bottom-question\">제목의 <b>주제<\/b>·<b>표현<\/b>·<b>관계 구조<\/b>는 시대에 따라 어떻게 달라졌는가?<\/p>\n        "},{"layout":"source-brief","eyebrow":"SOURCE · KOREAN HISTORY RESEARCH BULLETIN","title":"한국사연구휘보는 1973년부터 이어진<br><em>한국사 연구문헌의 장기 지도<\/em>다","content":"\n          <div class=\"source-identity\">\n            <section><span>발행·구축<\/span><strong>국사편찬위원회<\/strong><\/section>\n            <section><span>수록 자료<\/span><strong>한국사 관련 저서·논문<\/strong><\/section>\n            <section><span>주요 필드<\/span><strong>시대 · 저자 · 제목 · 게재지 · 발행처 · 발행일<\/strong><\/section>\n          <\/div>\n          <div class=\"source-span\" aria-label=\"한국사연구휘보 수록 범위\">\n            <div><small>1973.04<\/small><b>제1호<\/b><\/div>\n            <i>→<\/i>\n            <div><small>2026.07<\/small><b>제214호<\/b><span>990건<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <p class=\"takeaway source-brief-copy\">이 발표는 이 장기 서지에서 <b>1976–2025년 논문 제목<\/b>을 추출해 시계열로 읽는다.<\/p>\n          <a class=\"source-link source-link-large\" href=\"https://db.history.go.kr/diachronic/level.do?volumeId=hb_214\" target=\"_blank\" rel=\"noreferrer\">\n            한국사연구휘보 제214호 보기 <span>↗<\/span>\n          <\/a>\n        "},{"layout":"corpus","eyebrow":"CORPUS","title":"분석 대상은 <em>북한 발행물을 제외한 제목<\/em>으로<br>다시 구성했다","content":"\n          <div class=\"metric-row corpus-metrics\">\n            <div class=\"metric\"><strong>169,477<\/strong><span>원본 통합 서지<\/span><\/div>\n            <div class=\"metric metric-muted\"><strong>−3,627<\/strong><span>북한 발행 서지<\/span><\/div>\n            <div class=\"metric metric-accent\"><strong>111,327<\/strong><span>1976~2025 핵심 논문<\/span><\/div>\n          <\/div>\n          <p class=\"clarifier\">북한을 연구한 남한·외국 학계의 논문은 남기고,<br><b>북한에서 발행된 자료만<\/b> 출판사·학술지명 기준으로 제외했다.<\/p>\n        ","visual":"\n          <div class=\"pipeline\" aria-label=\"분석 과정\">\n            <span>서지 원본<\/span><i>→<\/i><span>발행처 판별<\/span><i>→<\/i><span>제목 정규화<\/span><i>→<\/i><span>빈도·공출현·시계열<\/span>\n          <\/div>\n          <div class=\"audit-line\">\n            <span>비지도 연표 <b>114,172편<\/b><\/span>\n            <span>무결성 <b>ok<\/b><\/span>\n            <span>잔존 제외대상 <b>0건<\/b><\/span>\n          <\/div>\n        "},{"layout":"volume","eyebrow":"NORMALIZATION","title":"논문이 약 <em>3.8배<\/em> 늘었으니 절대 빈도는 비교할 수 없다","content":"\n          <div class=\"volume-chart\" aria-label=\"초기와 최근 논문 수 비교\">\n            <div class=\"volume-column\">\n              <span class=\"volume-value\">8,607<\/span>\n              <div class=\"volume-bar\" style=\"--h:26%\"><\/div>\n              <span class=\"volume-label\">1976–1985<\/span>\n            <\/div>\n            <div class=\"volume-column\">\n              <span class=\"volume-value accent\">32,869<\/span>\n              <div class=\"volume-bar accent-bar\" style=\"--h:100%\"><\/div>\n              <span class=\"volume-label\">2016–2025<\/span>\n            <\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"method-list\">\n            <p><span>01<\/span> 제목 1,000편당 출현율<\/p>\n            <p><span>02<\/span> 개념 10,000개당 비중<\/p>\n            <p><span>03<\/span> 다중검정 FDR 보정<\/p>\n            <p><span>04<\/span> 동일 학술지·표본수 재검증<\/p>\n          <\/div>\n          <p class=\"formula\"><b>절대수<\/b> ÷ 해당 시기 전체량 = <em>비교 가능한 상대적 위치<\/em><\/p>\n        "},{"layout":"title-density","eyebrow":"TITLE GRAMMAR","title":"제목은 길어진 것이 아니라<br><em>더 많은 관계<\/em>를 명시하게 됐다","content":"\n          <div class=\"dual-change\">\n            <section>\n              <span>평균 제목 길이<\/span>\n              <div class=\"change-values\"><b>21.54자<\/b><i>→<\/i><strong>32.68자<\/strong><\/div>\n              <div class=\"change-track\"><span style=\"--w:66%\"><\/span><b><\/b><\/div>\n              <small>+51.7%<\/small>\n            <\/section>\n            <section>\n              <span>제목당 고유 개념<\/span>\n              <div class=\"change-values\"><b>4.58개<\/b><i>→<\/i><strong>9.28개<\/strong><\/div>\n              <div class=\"change-track\"><span style=\"--w:49%\"><\/span><b><\/b><\/div>\n              <small>+102.6%<\/small>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <div class=\"title-examples\" aria-label=\"실제 논문 제목 비교\">\n            <article>\n              <span>1980 · 『한국민속학』<\/span>\n              <strong>「줄타기에 대하여」<\/strong>\n              <small>대상 중심<\/small>\n            <\/article>\n            <article>\n              <span>2001 · 『역사문제연구』<\/span>\n              <strong>「마을에서의 한국전쟁 경험과 그 기억 — 경기도 한 ‘모스크바’ 마을 사례를 중심으로」<\/strong>\n              <small>공간 + 경험 + 기억 + 사례<\/small>\n            <\/article>\n            <article>\n              <span>2025 · 『한국상고사학보』<\/span>\n              <strong>「원삼국시대~백제 한성기 중부지역의 인구변동: 주거지와 탄소연대측정치를 중심으로」<\/strong>\n              <small>시기 + 공간 + 변화 + 자료 + 방법<\/small>\n            <\/article>\n          <\/div>\n          <p class=\"takeaway\">대상을 명명하던 제목에서 <b>조건·관계·증거를 지정하는 분석 문장<\/b>으로.<\/p>\n        "},{"layout":"timeline","eyebrow":"FIVE-YEAR TIMELINE · 1976–2000","title":"5년 단위로 보면<br><em>시대별 연구 의제<\/em>가 나타난다","content":"\n          <div class=\"era-timeline timeline-five\">\n            <div data-detail-index=\"0\"><b>1976–80<\/b><span>연구·고찰<br>왕조·인물·사상<\/span><\/div>\n            <div data-detail-index=\"1\"><b>1981–85<\/b><span>기존 연구 형식<br>정치·운동 언어<\/span><\/div>\n            <div data-detail-index=\"2\"><b>1986–90<\/b><span>노동·농민<br>정책·조직·과정<\/span><\/div>\n            <div data-detail-index=\"3\"><b>1991–95<\/b><span>지역·여성<br>공간·국제·외교<\/span><\/div>\n            <div data-detail-index=\"4\"><b>1996–2000<\/b><span>경계·전환<br>동아시아·재외한인<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"three-stats\">\n            <span><b>1,937<\/b> 단기 특징어<\/span>\n            <span><b>5,073<\/b> 특징 공출현<\/span>\n            <span><b>457<\/b> 지속적 부상어<\/span>\n          <\/div>\n        "},{"layout":"timeline","eyebrow":"FIVE-YEAR TIMELINE · 2001–2025","title":"2000년대 이후 연구 의제는<br><em>기억에서 현재적 사용<\/em>으로 이어진다","content":"\n          <div class=\"era-timeline timeline-five\">\n            <div data-detail-index=\"5\"><b>2001–05<\/b><span>기억·정체성<br>교과서·기록<\/span><\/div>\n            <div data-detail-index=\"6\"><b>2006–10<\/b><span>담론·표상<br>공간·제국·경계<\/span><\/div>\n            <div data-detail-index=\"7\"><b>2011–15<\/b><span>교육·공공쟁점<br>피해·냉전·네트워크<\/span><\/div>\n            <div data-detail-index=\"8\"><b>2016–20<\/b><span>기록·일기·사행<br>기념주기<\/span><\/div>\n            <div data-detail-index=\"9\"><b>2021–25<\/b><span>서사·재현·물질<br>의료·공공역사<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <p class=\"timeline-big-takeaway\">과거의 <b>사실<\/b>에서 → 과거를 전달하는 <b>기억·표상·기록<\/b>으로 → 오늘의 <b>활용·가치<\/b>로.<\/p>\n          <p class=\"caution\">2021–2025는 현재까지 관측된 구간이며 다음 5년의 지속 여부는 아직 확인할 수 없다.<\/p>\n        "},{"layout":"grammar-era","eyebrow":"1970s","title":"1970년대 제목은 <em>‘무엇에 관한 연구인가’<\/em>를 앞세웠다","content":"\n          <div class=\"token-line token-line-large\">\n            <span>연구<\/span><span>고찰<\/span><span>소고<\/span><span>중심<\/span><span>특히<\/span>\n          <\/div>\n          <div class=\"grammar-equation\">\n            <div><small>이미 정해진 대상<\/small><b>왕조 · 인물 · 사상<\/b><\/div>\n            <i>+<\/i>\n            <div><small>연구 장르<\/small><b>연구 · 고찰 · 소고<\/b><\/div>\n          <\/div>\n        ","visual":"\n          <blockquote class=\"era-claim\">새로운 문제를 전면화하기보다,<br>이미 존재하는 <em>대상을 연구·고찰<\/em>한다고 밝혔다.<\/blockquote>\n          <div class=\"era-paper-examples\">\n            <article><span>1978 · 『한양대학교 논문집』 12<\/span><strong>「이두 표기법에 대한 연구」<\/strong><\/article>\n            <article><span>1976 · 『한국사연구』 14<\/span><strong>「한국 선사시대의 자연환경 연구 — 선사유적지의 층위와 고생물과의 연관을 중심으로」<\/strong><\/article>\n          <\/div>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · 1976–1980","title":"‘중심’·‘연구’가 제목 개념의<br><em>가장 큰 몫<\/em>을 차지했다","content":"\n          <div class=\"evidence-chart\" aria-label=\"1976년부터 1980년까지 주요 제목 개념의 정규화 비중\">\n            <div class=\"evidence-head\">\n              <span>제목 개념<\/span><span>1976–1980 · 논문 3,658편<\/span><span>개념 10,000개당<\/span>\n            <\/div>\n            <div class=\"stat-row stat-single\">\n              <strong>중심<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-current\" style=\"--w:95.7%\"><\/span><\/div><b>622.2<\/b>\n            <\/div>\n            <div class=\"stat-row stat-single\">\n              <strong>연구<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-current\" style=\"--w:90.6%\"><\/span><\/div><b>588.7<\/b>\n            <\/div>\n            <div class=\"stat-row stat-single\">\n              <strong>고찰<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-current\" style=\"--w:29.8%\"><\/span><\/div><b>194.0<\/b>\n            <\/div>\n            <div class=\"stat-row stat-single\">\n              <strong>소고<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-current\" style=\"--w:8.2%\"><\/span><\/div><b>53.5<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>325<\/span><span>650<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>해석<\/span><strong>대상을 새롭게 정의하기보다 <b>연구 장르와 초점<\/b>을 먼저 명시하는 제목 문법이 우세했다.<\/strong><\/div>\n          <p class=\"evidence-method\">정규화 개념 출현량 · 5년 창 · 북한 발행물 제외<\/p>\n        "},{"layout":"rise","eyebrow":"1980s","title":"1980년대에는 기존 연구 형식 안으로<br><em>집단·제도·과정<\/em>이 들어왔다","content":"\n          <div class=\"decade-phase\">\n            <section><span>1981–1985<\/span><strong>연구·고찰의 지속<\/strong><small>일제하 · 교과서 · 정치·운동 언어의 진입<\/small><\/section>\n            <i>→<\/i>\n            <section><span>1986–1990<\/span><strong>사회집단과 국가 작동<\/strong><small>노동 · 농민 · 정책 · 조직 · 과정<\/small><\/section>\n          <\/div>\n          <div class=\"rise-chart rise-chart-compact\" aria-label=\"1986~1990 지속 부상어\">\n            <div><span>과정<\/span><i><b style=\"--start:26%;--end:67%\"><\/b><\/i><strong>13.6 → 33.9<\/strong><\/div>\n            <div><span>정책<\/span><i><b style=\"--start:15%;--end:40%\"><\/b><\/i><strong>7.8 → 20.0<\/strong><\/div>\n            <div><span>노동<\/span><i><b style=\"--start:2%;--end:25%\"><\/b><\/i><strong>1.2 → 12.8<\/strong><\/div>\n            <div><span>농민<\/span><i><b style=\"--start:9%;--end:36%\"><\/b><\/i><strong>4.5 → 18.4<\/strong><\/div>\n          <\/div>\n          <small class=\"unit-label\">후반기(1986–1990), 전체 개념 10,000개당 비중<\/small>\n        ","visual":"\n          <div class=\"era-paper-examples vertical\">\n            <article><span>1987 · 『사회와 역사』 9<\/span><strong>「일제하 노동 운동의 방향 전환에 관한 연구」<\/strong><\/article>\n            <article><span>1988 · 『사회와 역사』 13<\/span><strong>「미 군정기 농민 운동의 성격과 전개 과정」<\/strong><\/article>\n          <\/div>\n          <p class=\"takeaway\">주체는 <b>노동자·농민<\/b>으로, 설명은 <b>정책·조직·과정<\/b>으로 확장됐다.<\/p>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · 1980s","title":"1980년대 후반, 네 용어가<br><em>모두 두 배 이상<\/em> 상승했다","content":"\n          <div class=\"evidence-chart\" aria-label=\"1980년대 전반과 후반의 과정 정책 노동 농민 비중 비교\">\n            <div class=\"evidence-head\">\n              <span>제목 개념<\/span>\n              <span class=\"evidence-legend\"><i class=\"legend-before\"><\/i>1981–1985 <i class=\"legend-after\"><\/i>1986–1990<\/span>\n              <span>개념 10,000개당<\/span>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>과정<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:42.1%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:100%\"><\/span><\/div><b>14.3 → 33.9<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>정책<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:26.3%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:59.1%\"><\/span><\/div><b>8.9 → 20.0<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>노동<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:5.3%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:37.8%\"><\/span><\/div><b>1.8 → 12.8<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>농민<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:10.5%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:54.1%\"><\/span><\/div><b>3.6 → 18.4<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>17<\/span><span>34<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>해석<\/span><strong>개별 유행어가 아니라 <b>집단·정책·과정의 묶음<\/b>이 같은 시점에 커졌다.<\/strong><\/div>\n          <p class=\"evidence-method\">1981–1985 N=4,949 · 1986–1990 N=6,540 · 정규화 개념 비중<\/p>\n        "},{"layout":"scale","eyebrow":"1990s","title":"지역·여성·국제관계가 <em>새로운 역사 단위<\/em>가 됐다","content":"\n          <div class=\"scale-shift\">\n            <div class=\"scale-center\">국가·왕조<\/div>\n            <div class=\"scale-rays\" aria-label=\"확장된 분석 단위\">\n              <span>지역<\/span><span>주민<\/span><span>여성<\/span><span>공간<\/span><span>외교<\/span><span>동아시아<\/span><span>재외 한인<\/span>\n            <\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"rise-numbers\">\n            <span><b>지역<\/b>12.5 → 47.8<\/span>\n            <span><b>문화<\/b>21.1 → 49.5<\/span>\n            <span><b>여성<\/b>9.5 → 19.3<\/span>\n            <span><b>공간<\/b>1.9 → 7.6<\/span>\n          <\/div>\n          <div class=\"era-paper-examples vertical compact\">\n            <article><span>1990 · 『사회와 역사』 25<\/span><strong>「식민지 시대 여성 노동 운동에 관한 연구」<\/strong><\/article>\n            <article><span>1990 · 『동국사학』 24<\/span><strong>「러시아와 조선간의 경제·외교관계의 수립」<\/strong><\/article>\n          <\/div>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · EARLY 1990s","title":"지역·문화·여성·공간이<br><em>1990년대 초 함께 뛰었다<\/em>","content":"\n          <div class=\"evidence-chart\" aria-label=\"1980년대 후반과 1990년대 전반의 지역 문화 여성 공간 비중 비교\">\n            <div class=\"evidence-head\">\n              <span>제목 개념<\/span>\n              <span class=\"evidence-legend\"><i class=\"legend-before\"><\/i>1986–1990 <i class=\"legend-after\"><\/i>1991–1995<\/span>\n              <span>개념 10,000개당<\/span>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>지역<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:39.3%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:96.6%\"><\/span><\/div><b>19.5 → 47.8<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>문화<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:51.7%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:100%\"><\/span><\/div><b>25.6 → 49.5<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>여성<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:21.3%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:38.9%\"><\/span><\/div><b>10.6 → 19.3<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>공간<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:6.7%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:15.3%\"><\/span><\/div><b>3.3 → 7.6<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>25<\/span><span>50<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>해석<\/span><strong>국가·왕조만이 아니라 <b>지역과 사회적 위치<\/b>가 독립된 분석 단위로 부상했다.<\/strong><\/div>\n          <p class=\"evidence-method\">1986–1990 N=6,540 · 1991–1995 N=8,760 · 정규화 개념 비중<\/p>\n        "},{"layout":"concept-sequence","eyebrow":"2000s","title":"2000년대에는 과거가<br><em>기억·표상되는 방식<\/em> 자체가 연구문제가 됐다","content":"\n          <div class=\"concept-steps concept-steps-two\">\n            <section>\n              <span>2001–2005<\/span>\n              <strong>기억 · 정체성<\/strong>\n              <p>과거가 현재의 집단 정체성과<br>교과서 서술에 연결되는 방식<\/p>\n              <small><b>기억<\/b> 1 → 36편 · <b>정체성<\/b> 6 → 51편<\/small>\n            <\/section>\n            <i>→<\/i>\n            <section>\n              <span>2006–2010<\/span>\n              <strong>담론 · 표상 · 공간<\/strong>\n              <p>과거가 제국·경계·일상 속에서<br>구성되고 표현되는 방식<\/p>\n              <small><b>담론<\/b> 31 → 121편 · <b>표상<\/b> 3 → 48편<\/small>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <div class=\"era-paper-examples\">\n            <article><span>2001 · 『한국민족운동사연구』 27<\/span><strong>「과거 기억과 현재의 상존 — 1930년대 만주지역 항일무장투쟁사」<\/strong><\/article>\n            <article><span>2008 · 『역사문제연구』 19<\/span><strong>「‘이승만’이라는 표상」<\/strong><\/article>\n          <\/div>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · 2000s","title":"기억·정체성에서<br><em>담론·표상으로 상승이 이어졌다<\/em>","content":"\n          <div class=\"evidence-chart\" aria-label=\"1996년부터 2010년까지 기억 정체성 담론 표상의 정규화 비중\">\n            <div class=\"evidence-head\">\n              <span>제목 개념<\/span>\n              <span class=\"evidence-legend\"><i class=\"legend-first\"><\/i>1996–00 <i class=\"legend-mid\"><\/i>2001–05 <i class=\"legend-after\"><\/i>2006–10<\/span>\n              <span>개념 10,000개당<\/span>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>기억<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:1.6%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:43.2%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:72.3%\"><\/span><\/div><b>0.2 → 6.5 → 10.8<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>정체성<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:9.8%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:61.1%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:55.1%\"><\/span><\/div><b>1.5 → 9.2 → 8.3<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>담론<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:31%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:37.2%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:99.4%\"><\/span><\/div><b>4.7 → 5.6 → 14.9<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>표상<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:3.3%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:18%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:39.4%\"><\/span><\/div><b>0.5 → 2.7 → 5.9<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>7.5<\/span><span>15<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>해석<\/span><strong>과거의 사실보다 <b>과거가 기억되고 표현되는 방식<\/b>이 측정 가능한 연구 의제로 성장했다.<\/strong><\/div>\n          <p class=\"evidence-method\">1996–2000 N=10,808 · 2001–2005 N=12,774 · 2006–2010 N=15,740<\/p>\n        "},{"layout":"present-use","eyebrow":"2010s","title":"2010년대에는<br><em>공공 쟁점과 기록·경험<\/em>이 연결됐다","content":"\n          <div class=\"three-columns present-columns decade-two\">\n            <section>\n              <span>2011–2015<\/span>\n              <strong>공공 쟁점<\/strong>\n              <p>교육과정 · 교과서<br>민간인 피해 · 냉전<br>네트워크 · 콘텐츠 활용<\/p>\n            <\/section>\n            <section>\n              <span>2016–2020<\/span>\n              <strong>기록과 경험<\/strong>\n              <p>기록 · 일기 · 사행<br>장소 · 고고자료<br>기념주기의 집중<\/p>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <div class=\"era-paper-examples\">\n            <article><span>2014 · 『역사와 교육』 18<\/span><strong>「역사 교과서, 현대사를 어디까지 서술할 것인가?」<\/strong><\/article>\n            <article><span>2016 · 『한국민족문화』 61<\/span><strong>「일기를 통해 본 농촌 여성의 일상과 역할」<\/strong><\/article>\n          <\/div>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · 2010s","title":"기록·일기는 2010년대 후반까지<br><em>계속 상승했다<\/em>","content":"\n          <div class=\"evidence-chart\" aria-label=\"2006년부터 2020년까지 기록 일기 냉전 교과서의 정규화 비중\">\n            <div class=\"evidence-head\">\n              <span>제목 개념<\/span>\n              <span class=\"evidence-legend\"><i class=\"legend-first\"><\/i>2006–10 <i class=\"legend-mid\"><\/i>2011–15 <i class=\"legend-after\"><\/i>2016–20<\/span>\n              <span>개념 10,000개당<\/span>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>기록<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:51.3%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:63.9%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:98.1%\"><\/span><\/div><b>15.9 → 19.8 → 30.4<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>일기<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:6.4%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:13.5%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:27.5%\"><\/span><\/div><b>2.0 → 4.2 → 8.5<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>냉전<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:6.4%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:16.2%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:17.4%\"><\/span><\/div><b>2.0 → 5.0 → 5.4<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>교과서<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:65.6%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:76.2%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:61.9%\"><\/span><\/div><b>20.3 → 23.6 → 19.2<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>15.5<\/span><span>31<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>해석<\/span><strong>공공 쟁점의 관심과 함께 <b>기록 매체를 통해 경험을 복원<\/b>하는 흐름이 누적됐다.<\/strong><\/div>\n          <p class=\"evidence-method\">2006–2010 N=15,740 · 2011–2015 N=15,229 · 2016–2020 N=15,099<\/p>\n        "},{"layout":"present-use","eyebrow":"2020s · OBSERVED 2021–2025","title":"2020년대에는 과거의<br><em>현재적 사용과 새로운 매개<\/em>가 전면에 놓였다","content":"\n          <div class=\"three-columns present-columns\">\n            <section>\n              <span>의미의 매개<\/span>\n              <strong>서사 · 재현<\/strong>\n              <p>과거가 어떤 이야기와<br>이미지로 현재에 전달되는가<\/p>\n            <\/section>\n            <section>\n              <span>몸과 사물<\/span>\n              <strong>물질 · 의료 · 보건<\/strong>\n              <p>몸·사물·병원·제도적 실천을<br>역사의 문제로 읽기<\/p>\n            <\/section>\n            <section>\n              <span>현재의 가치<\/span>\n              <strong>유산 · 활용 · 공공역사<\/strong>\n              <p>과거를 보존하고 사용하며<br>공공적 가치를 만드는 방식<\/p>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <div class=\"era-paper-examples\">\n            <article><span>2023 · 『역사와 현실』 129<\/span><strong>「공공역사를 대하는 우리의 자세」<\/strong><\/article>\n            <article><span>2024 · 『역사연구』 49<\/span><strong>「물질과 감각으로 읽는 냉전의 일상」<\/strong><\/article>\n          <\/div>\n          <p class=\"caution\">2021–2025는 현재까지 관측된 미완결 구간이다.<\/p>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · 2021–2025","title":"새로운 매개와 현재적 사용을 가리키는<br><em>다섯 용어가 모두 상승했다<\/em>","content":"\n          <div class=\"evidence-chart evidence-chart-dense\" aria-label=\"2016년부터 2025년까지 서사 물질 의료 유산 공공역사의 정규화 비중\">\n            <div class=\"evidence-head\">\n              <span>제목 개념<\/span>\n              <span class=\"evidence-legend\"><i class=\"legend-before\"><\/i>2016–2020 <i class=\"legend-after\"><\/i>2021–2025<\/span>\n              <span>개념 10,000개당<\/span>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>서사<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:44.9%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:94.8%\"><\/span><\/div><b>5.4 → 11.4<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>물질<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:6.5%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:25.7%\"><\/span><\/div><b>0.8 → 3.1<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>의료<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:29.9%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:50%\"><\/span><\/div><b>3.6 → 6.0<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>유산<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:30.8%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:61%\"><\/span><\/div><b>3.7 → 7.3<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>공공역사<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:0.9%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:19.8%\"><\/span><\/div><b>0.1 → 2.4<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>6<\/span><span>12<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>해석<\/span><strong><b>서사·물질·의료·유산·공공역사<\/b>가 과거와 현재를 잇는 새로운 연구 어휘가 됐다.<\/strong><\/div>\n          <p class=\"evidence-method\">2016–2020 N=15,099 · 2021–2025 N=17,770 · 공공역사 1편 → 27편<\/p>\n        "},{"layout":"joseon","eyebrow":"SAME PAST, NEW QUESTIONS","title":"같은 조선도 <em>사상가에서<\/em><br><em>제도·지역·기록의 작동<\/em>으로 다시 읽혔다","content":"\n          <div class=\"joseon-compare\">\n            <section>\n              <span>초기 상대 중심<\/span>\n              <strong>퇴계 · 율곡 · 다산<br>실학 · 정치사상<\/strong>\n              <p>누가 어떤 사상을 만들었는가<\/p>\n            <\/section>\n            <i>→<\/i>\n            <section>\n              <span>최근 상승<\/span>\n              <strong>지역 · 양상 · 인식<br>운영 · 기록 · 과정<\/strong>\n              <p>제도와 지역사회는 어떻게 작동하고 기록되었는가<\/p>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <div class=\"confidence-strip\">\n            <span><b>양상<\/b> +63.7 <small>95% +51.1~+74.6<\/small><\/span>\n            <span><b>지역<\/b> +48.1 <small>95% +37.6~+58.9<\/small><\/span>\n            <span><b>인식<\/b> +42.3 <small>95% +30.7~+55.1<\/small><\/span>\n          <\/div>\n          <p class=\"micro-note\">개념 10,000개당 부트스트랩 중앙 변화량. 인물 연구의 소멸이 아니라 <b>중심의 분산<\/b>이다.<\/p>\n        "},{"layout":"networks","eyebrow":"CO-OCCURRENCE","title":"공출현은 단어의 유행을<br><em>연구 의제의 묶음<\/em>으로 바꿔준다","content":"\n          <p class=\"deck-definition\">공출현 = 두 단어가 같은 제목 안에 함께 등장한 관계<\/p>\n          <div class=\"network-row\">\n            <section class=\"mini-network net-80s\" aria-label=\"1980년대 공출현\">\n              <b>1980s<\/b>\n              <svg class=\"network-svg\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"노동과 농민이 운동에, 구조가 성격에 연결된 공출현망\">\n                <g class=\"svg-edges\"><line x1=\"56\" y1=\"38\" x2=\"150\" y2=\"75\"/><line x1=\"56\" y1=\"112\" x2=\"150\" y2=\"75\"/><line x1=\"238\" y1=\"38\" x2=\"238\" y2=\"112\"/><\/g>\n                <g class=\"svg-node\" transform=\"translate(56 38)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>노동<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(150 75)\"><rect x=\"-34\" y=\"-16\" width=\"68\" height=\"32\"/><text>운동<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(56 112)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>농민<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(238 38)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>구조<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(238 112)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>성격<\/text><\/g>\n              <\/svg>\n            <\/section>\n            <section class=\"mini-network net-00s\" aria-label=\"2000년대 공출현\">\n              <b>2000s<\/b>\n              <svg class=\"network-svg\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"기억과 정체성, 담론과 표상과 공간이 연결된 공출현망\">\n                <g class=\"svg-edges\"><line x1=\"58\" y1=\"38\" x2=\"150\" y2=\"38\"/><line x1=\"58\" y1=\"112\" x2=\"150\" y2=\"112\"/><line x1=\"150\" y1=\"112\" x2=\"242\" y2=\"75\"/><\/g>\n                <g class=\"svg-node\" transform=\"translate(58 38)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>기억<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(150 38)\"><rect x=\"-38\" y=\"-16\" width=\"76\" height=\"32\"/><text>정체성<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(58 112)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>담론<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(150 112)\"><rect x=\"-31\" y=\"-16\" width=\"62\" height=\"32\"/><text>표상<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(242 75)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>공간<\/text><\/g>\n              <\/svg>\n            <\/section>\n            <section class=\"mini-network net-20s\" aria-label=\"2021~2025 공출현\">\n              <b>2021–2025<\/b>\n              <svg class=\"network-svg\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"공공, 역사, 서사, 자료, 함의가 연결된 공출현망\">\n                <g class=\"svg-edges\"><line x1=\"50\" y1=\"38\" x2=\"150\" y2=\"38\"/><line x1=\"150\" y1=\"38\" x2=\"242\" y2=\"75\"/><line x1=\"78\" y1=\"116\" x2=\"200\" y2=\"116\"/><line x1=\"200\" y1=\"116\" x2=\"242\" y2=\"75\"/><\/g>\n                <g class=\"svg-node\" transform=\"translate(50 38)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>공공<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(150 38)\"><rect x=\"-31\" y=\"-16\" width=\"62\" height=\"32\"/><text>역사<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(242 75)\"><rect x=\"-31\" y=\"-16\" width=\"62\" height=\"32\"/><text>서사<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(78 116)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>자료<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(200 116)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>함의<\/text><\/g>\n              <\/svg>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <p class=\"takeaway\">빈도는 <b>관심의 크기<\/b>를,<br>공출현은 그 관심이 <b>어떤 질문으로 조직됐는지<\/b>를 보여준다.<\/p>\n          <div class=\"pair-stat\"><b>8,258쌍<\/b> 검정 <i>→<\/i> <strong>329쌍<\/strong> 유의성·효과 기준 충족<\/div>\n        "},{"layout":"robustness","eyebrow":"ROBUSTNESS","title":"이 결과를 <em>얼마나 믿을 수 있는가?<\/em>","content":"\n          <div class=\"validation-ladder\">\n            <span><b>01<\/b> 논문 수·제목 길이 정규화<\/span>\n            <span><b>02<\/b> 5년·10년 구간 교차 확인<\/span>\n            <span><b>03<\/b> 동일 학술지만 비교<\/span>\n            <span><b>04<\/b> 같은 수의 논문을 300번 다시 뽑아 검증<\/span>\n            <span><b>05<\/b> 학술지 집중도 표시<\/span>\n            <span><b>06<\/b> 북한 발행물 제외 후 재실행<\/span>\n          <\/div>\n        ","visual":"\n          <div class=\"robust-funnel\">\n            <div><strong>384<\/strong><span>변화 후보<\/span><\/div>\n            <i>→<\/i>\n            <div><strong>214<\/strong><span>방향 일관<\/span><\/div>\n            <i>→<\/i>\n            <div class=\"funnel-accent\"><strong>50<\/strong><span>엄격 통과<\/span><\/div>\n          <\/div>\n          <div class=\"robust-explain\">\n            <section><span>부트스트랩 300회<\/span><strong>두 시기의 논문 수를 같게 맞춘 뒤<br>무작위 재표집을 300번 반복<\/strong><\/section>\n            <section><span>54 / 63<\/span><strong>새 학술지의 등장 때문이 아니라<br>기존 공통 학술지에서도 증가한 급증어<\/strong><\/section>\n          <\/div>\n          <div class=\"correction\">\n            <span><b>사라짐<\/b> 인민–투쟁–혁명 · 수령–김일성–현명<\/span>\n            <span><b>유지<\/b> 노동·농민·지역 · 기억·표상 · 서사·의료·유산<\/span>\n          <\/div>\n        "},{"layout":"synthesis","eyebrow":"SYNTHESIS · THE FIELD’S SENSE OF ITS TIME","title":"한국 역사학계의 시대의식은<br><em>대상의 규명<\/em>에서 <em>과거의 작동과 현재적 사용<\/em>을 묻는 방향으로<br>확장됐다","content":"\n          <div class=\"synthesis-flow\">\n            <section><span>1970s<\/span><strong>대상 규명<\/strong><p>왕조·인물·사상을<br>연구하고 고찰<\/p><\/section>\n            <i>→<\/i>\n            <section><span>1980s–1990s<\/span><strong>주체와 구조<\/strong><p>집단·제도·지역·여성·<br>국제관계의 작동<\/p><\/section>\n            <i>→<\/i>\n            <section><span>2000s–2010s<\/span><strong>기억과 경험<\/strong><p>담론·표상·교육·기록으로<br>과거가 매개되는 방식<\/p><\/section>\n            <i>→<\/i>\n            <section><span>2020s<\/span><strong>현재적 사용<\/strong><p>서사·물질·유산·공공역사로<br>가치를 만드는 과정<\/p><\/section>\n          <\/div>\n        ","visual":"\n          <p class=\"synthesis-conclusion\">무엇이 있었는가를 밝히는 역사에서,<br><b>과거가 누구에게 어떻게 경험·기억·재현되고 오늘에 사용되는가<\/b>를 묻는 역사로.<\/p>\n        "},{"layout":"closing","eyebrow":"CONCLUSION","title":"멀리서 읽으면<br><em>과거를 보는 현재의 방식<\/em>이 보인다","content":"\n          <blockquote class=\"closing-thesis\">\n            역사학의 관심은<br>\n            <span>‘과거에 무엇이 있었는가’<\/span>에서<br>\n            <strong>‘과거가 어떤 관계와 매개를 통해 경험·기억·재현되고,<br>현재에 어떤 방식으로 사용되는가’<\/strong>로 확장됐다.\n          <\/blockquote>\n        ","visual":"\n          <div class=\"limits\">\n            <span>제목은 공적으로 표명된 문제의식의 압축본<\/span>\n            <span>빈도·공출현은 사회적 인과를 입증하지 않음<\/span>\n            <span>1970년대 초기·2020년대 미완결 구간은 신중히 해석<\/span>\n          <\/div>\n          <p class=\"final-line\">멀리서 읽기는 개별 논문을 대체하지 않는다.<br><b>어떤 질문이 가능해졌는지를 발견해 다시 가까이 읽게 한다.<\/b><\/p>\n        "}]},"en":{"meta":{"title":"Reading the Present in Scholarship about the Past"},"slides":[{"layout":"cover","eyebrow":"DISTANT READING · 1970–2025","title":"A Distant Reading of the<br><em>Bulletin of Korean<br>Historical Studies:<\/em><br>Temporal Consciousness in Korean<br>Historiographical Publications","content":"\n          <p class=\"cover-subtitle\">A distant reading of more than 110,000 titles in Korean historical scholarship<\/p>\n          <p class=\"cover-thesis\">One paper speaks about the past.<br>The corpus speaks about the questions of its present.<\/p>\n        ","visual":"\n          <div class=\"word-field word-field-en\" aria-hidden=\"true\">\n            <span style=\"--x:4%;--y:8%;--s:.88\">study<\/span>\n            <span style=\"--x:42%;--y:5%;--s:.68\">examination<\/span>\n            <span style=\"--x:16%;--y:26%;--s:.82\">dynasty<\/span>\n            <span style=\"--x:52%;--y:24%;--s:1.0\">region<\/span>\n            <span style=\"--x:2%;--y:47%;--s:.76\">women<\/span>\n            <span style=\"--x:38%;--y:44%;--s:1.12\">memory<\/span>\n            <span style=\"--x:8%;--y:67%;--s:.88\">representation<\/span>\n            <span style=\"--x:54%;--y:64%;--s:1.2\">narrative<\/span>\n            <span style=\"--x:20%;--y:86%;--s:.70\">public history<\/span>\n          <\/div>\n        "},{"layout":"split-claim","eyebrow":"RESEARCH QUESTION","title":"The corpus speaks about <em>the questions of its present<\/em>","content":"\n          <div class=\"question-pair\">\n            <section>\n              <span class=\"question-index\">01<\/span>\n              <p>One paper<\/p>\n              <strong>“What happened<br>in the past?”<\/strong>\n            <\/section>\n            <section>\n              <span class=\"question-index\">110K+<\/span>\n              <p>A corpus of papers<\/p>\n              <strong>“What questions do historians<br>primarily focus on?”<\/strong>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <p class=\"bottom-question\">How did the <b>topics<\/b>, <b>expressions<\/b>, and <b>relational structures<\/b> of titles change over time?<\/p>\n        "},{"layout":"source-brief","eyebrow":"SOURCE · KOREAN HISTORY RESEARCH BULLETIN","title":"The Korean History Research Bulletin is<br><em>a long-running map of historical scholarship<\/em>","content":"\n          <div class=\"source-identity\">\n            <section><span>Published and maintained by<\/span><strong>National Institute of Korean History<\/strong><\/section>\n            <section><span>Materials indexed<\/span><strong>Books and articles on Korean history<\/strong><\/section>\n            <section><span>Core fields<\/span><strong>Period · author · title · journal · publisher · date<\/strong><\/section>\n          <\/div>\n          <div class=\"source-span\" aria-label=\"Coverage of the Korean History Research Bulletin\">\n            <div><small>Apr 1973<\/small><b>Issue 1<\/b><\/div>\n            <i>→<\/i>\n            <div><small>Jul 2026<\/small><b>Issue 214<\/b><span>990 records<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <p class=\"takeaway source-brief-copy\">This deck extracts <b>article titles from 1976–2025<\/b> and reads them as a time series.<\/p>\n          <a class=\"source-link source-link-large\" href=\"https://db.history.go.kr/diachronic/level.do?volumeId=hb_214\" target=\"_blank\" rel=\"noreferrer\">\n            Open Korean History Research Bulletin, Issue 214 <span>↗<\/span>\n          <\/a>\n        "},{"layout":"corpus","eyebrow":"CORPUS","title":"The corpus was rebuilt to exclude<br><em>publications issued in North Korea<\/em>","content":"\n          <div class=\"metric-row corpus-metrics\">\n            <div class=\"metric\"><strong>169,477<\/strong><span>source bibliography<\/span><\/div>\n            <div class=\"metric metric-muted\"><strong>−3,627<\/strong><span>North Korean records<\/span><\/div>\n            <div class=\"metric metric-accent\"><strong>111,327<\/strong><span>core articles, 1976–2025<\/span><\/div>\n          <\/div>\n          <p class=\"clarifier\">South Korean and international studies <i>about<\/i> North Korea remained.<br>Only works <b>published in North Korea<\/b> were excluded by publisher and journal title.<\/p>\n        ","visual":"\n          <div class=\"pipeline\" aria-label=\"Analysis pipeline\">\n            <span>Bibliography<\/span><i>→<\/i><span>Publication audit<\/span><i>→<\/i><span>Title normalization<\/span><i>→<\/i><span>Frequency · co-occurrence · time<\/span>\n          <\/div>\n          <div class=\"audit-line\">\n            <span>Unsupervised timeline <b>114,172<\/b><\/span>\n            <span>Integrity <b>ok<\/b><\/span>\n            <span>Excluded records remaining <b>0<\/b><\/span>\n          <\/div>\n        "},{"layout":"volume","eyebrow":"NORMALIZATION","title":"Publication volume rose <em>3.8×<\/em>,<br>so raw counts are not comparable","content":"\n          <div class=\"volume-chart\" aria-label=\"Article volume in early and recent periods\">\n            <div class=\"volume-column\">\n              <span class=\"volume-value\">8,607<\/span>\n              <div class=\"volume-bar\" style=\"--h:26%\"><\/div>\n              <span class=\"volume-label\">1976–1985<\/span>\n            <\/div>\n            <div class=\"volume-column\">\n              <span class=\"volume-value accent\">32,869<\/span>\n              <div class=\"volume-bar accent-bar\" style=\"--h:100%\"><\/div>\n              <span class=\"volume-label\">2016–2025<\/span>\n            <\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"method-list\">\n            <p><span>01<\/span> occurrences per 1,000 titles<\/p>\n            <p><span>02<\/span> share per 10,000 concepts<\/p>\n            <p><span>03<\/span> false-discovery-rate correction<\/p>\n            <p><span>04<\/span> same-journal and equal-sample checks<\/p>\n          <\/div>\n          <p class=\"formula\"><b>Raw count<\/b> ÷ total volume in that period = <em>comparable relative position<\/em><\/p>\n        "},{"layout":"title-density","eyebrow":"TITLE GRAMMAR","title":"Titles did not merely grow longer;<br>they began to specify <em>more relationships<\/em>","content":"\n          <div class=\"dual-change\">\n            <section>\n              <span>Mean title length<\/span>\n              <div class=\"change-values\"><b>21.54 chars<\/b><i>→<\/i><strong>32.68 chars<\/strong><\/div>\n              <div class=\"change-track\"><span style=\"--w:66%\"><\/span><b><\/b><\/div>\n              <small>+51.7%<\/small>\n            <\/section>\n            <section>\n              <span>Unique concepts per title<\/span>\n              <div class=\"change-values\"><b>4.58<\/b><i>→<\/i><strong>9.28<\/strong><\/div>\n              <div class=\"change-track\"><span style=\"--w:49%\"><\/span><b><\/b><\/div>\n              <small>+102.6%<\/small>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <div class=\"title-examples\" aria-label=\"Comparison of actual article titles\">\n            <article>\n              <span>1980 · Korean Folklore<\/span>\n              <strong>“On Tightrope Walking”<\/strong>\n              <small>object-centered<\/small>\n            <\/article>\n            <article>\n              <span>2001 · Journal of Korean History Research<\/span>\n              <strong>“The Experience and Memory of the Korean War in a Village — A ‘Moscow’ Village in Gyeonggi Province”<\/strong>\n              <small>place + experience + memory + case<\/small>\n            <\/article>\n            <article>\n              <span>2025 · Journal of Korean Ancient Historical Society<\/span>\n              <strong>“Population Change in Central Korea from the Proto–Three Kingdoms Period to the Baekje Hanseong Period: Settlements and Radiocarbon Dates”<\/strong>\n              <small>period + place + change + evidence + method<\/small>\n            <\/article>\n          <\/div>\n          <p class=\"takeaway\">From naming an object to writing <b>an analytical proposition that specifies conditions, relations, and evidence<\/b>.<\/p>\n        "},{"layout":"timeline","eyebrow":"FIVE-YEAR TIMELINE · 1976–2000","title":"Five-year windows reveal<br><em>distinct period-specific agendas<\/em>","content":"\n          <div class=\"era-timeline timeline-five era-timeline-en\">\n            <div data-detail-index=\"0\"><b>1976–80<\/b><span>study · examination<br>dynasty · figures · thought<\/span><\/div>\n            <div data-detail-index=\"1\"><b>1981–85<\/b><span>established forms<br>politics · movements<\/span><\/div>\n            <div data-detail-index=\"2\"><b>1986–90<\/b><span>labor · peasants<br>policy · process<\/span><\/div>\n            <div data-detail-index=\"3\"><b>1991–95<\/b><span>region · women<br>space · diplomacy<\/span><\/div>\n            <div data-detail-index=\"4\"><b>1996–2000<\/b><span>boundaries · transition<br>East Asia · diaspora<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"three-stats\">\n            <span><b>1,937<\/b> short-period terms<\/span>\n            <span><b>5,073<\/b> distinctive pairs<\/span>\n            <span><b>457<\/b> sustained emergences<\/span>\n          <\/div>\n        "},{"layout":"timeline","eyebrow":"FIVE-YEAR TIMELINE · 2001–2025","title":"After 2000, agendas moved from<br><em>memory toward the present-day use of the past<\/em>","content":"\n          <div class=\"era-timeline timeline-five era-timeline-en\">\n            <div data-detail-index=\"5\"><b>2001–05<\/b><span>memory · identity<br>textbooks · records<\/span><\/div>\n            <div data-detail-index=\"6\"><b>2006–10<\/b><span>discourse · representation<br>space · empire · boundary<\/span><\/div>\n            <div data-detail-index=\"7\"><b>2011–15<\/b><span>education · public issues<br>victims · networks<\/span><\/div>\n            <div data-detail-index=\"8\"><b>2016–20<\/b><span>records · diaries · missions<br>anniversary cycles<\/span><\/div>\n            <div data-detail-index=\"9\"><b>2021–25<\/b><span>narrative · materiality<br>medicine · public history<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <p class=\"timeline-big-takeaway\">From past <b>facts<\/b> → to <b>memory, representation, and records<\/b> → to present-day <b>use and value<\/b>.<\/p>\n          <p class=\"caution\">2021–2025 is the latest observed window; persistence into the next five years cannot yet be tested.<\/p>\n        "},{"layout":"grammar-era","eyebrow":"1970s","title":"Titles foregrounded <em>“what this study examines”<\/em>","content":"\n          <div class=\"token-line token-line-large token-line-en\">\n            <span>연구 study<\/span><span>고찰 examination<\/span><span>소고 short study<\/span><span>중심 focus<\/span>\n          <\/div>\n          <div class=\"grammar-equation\">\n            <div><small>Established object<\/small><b>dynasty · figure · thought<\/b><\/div>\n            <i>+<\/i>\n            <div><small>Research genre<\/small><b>study · examination · note<\/b><\/div>\n          <\/div>\n        ","visual":"\n          <blockquote class=\"era-claim\">Rather than foregrounding a new problem,<br>titles declared <em>the object to be studied or examined<\/em>.<\/blockquote>\n          <div class=\"era-paper-examples\">\n            <article><span>1978 · Hanyang University Papers 12<\/span><strong>“A Study of Idu Orthography”<\/strong><\/article>\n            <article><span>1976 · Korean History Research 14<\/span><strong>“A study on Korea’s Prehistoric Natural Environment — Archaeological Strata and Paleontology”<\/strong><\/article>\n          <\/div>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · 1976–1980","title":"“Focus” and “study” occupied<br><em>the largest share of title concepts<\/em>","content":"\n          <div class=\"evidence-chart\" aria-label=\"Normalized shares of major title concepts from 1976 to 1980\">\n            <div class=\"evidence-head\">\n              <span>Title concept<\/span><span>1976–1980 · 3,658 papers<\/span><span>per 10,000 concepts<\/span>\n            <\/div>\n            <div class=\"stat-row stat-single\">\n              <strong>중심 focus<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-current\" style=\"--w:95.7%\"><\/span><\/div><b>622.2<\/b>\n            <\/div>\n            <div class=\"stat-row stat-single\">\n              <strong>연구 study<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-current\" style=\"--w:90.6%\"><\/span><\/div><b>588.7<\/b>\n            <\/div>\n            <div class=\"stat-row stat-single\">\n              <strong>고찰 examine<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-current\" style=\"--w:29.8%\"><\/span><\/div><b>194.0<\/b>\n            <\/div>\n            <div class=\"stat-row stat-single\">\n              <strong>소고 short study<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-current\" style=\"--w:8.2%\"><\/span><\/div><b>53.5<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>325<\/span><span>650<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>Reading<\/span><strong>Titles first named the <b>research genre and focal object<\/b> rather than defining a new problem.<\/strong><\/div>\n          <p class=\"evidence-method\">Normalized concept occurrences · five-year window · North Korean publications excluded<\/p>\n        "},{"layout":"rise","eyebrow":"1980s","title":"Established research forms absorbed<br><em>collective actors and institutional processes<\/em>","content":"\n          <div class=\"decade-phase\">\n            <section><span>1981–1985<\/span><strong>Established forms persist<\/strong><small>colonial period · textbooks · political and movement vocabulary<\/small><\/section>\n            <i>→<\/i>\n            <section><span>1986–1990<\/span><strong>Collective and institutional turn<\/strong><small>labor · peasants · policy · organization · process<\/small><\/section>\n          <\/div>\n          <div class=\"rise-chart rise-chart-compact\" aria-label=\"Sustained emergences in 1986–1990\">\n            <div><span>process<\/span><i><b style=\"--start:26%;--end:67%\"><\/b><\/i><strong>13.6 → 33.9<\/strong><\/div>\n            <div><span>policy<\/span><i><b style=\"--start:15%;--end:40%\"><\/b><\/i><strong>7.8 → 20.0<\/strong><\/div>\n            <div><span>labor<\/span><i><b style=\"--start:2%;--end:25%\"><\/b><\/i><strong>1.2 → 12.8<\/strong><\/div>\n            <div><span>peasant<\/span><i><b style=\"--start:9%;--end:36%\"><\/b><\/i><strong>4.5 → 18.4<\/strong><\/div>\n          <\/div>\n          <small class=\"unit-label\">Late 1980s (1986–1990), share per 10,000 concepts<\/small>\n        ","visual":"\n          <div class=\"era-paper-examples vertical\">\n            <article><span>1987 · Social History 9<\/span><strong>“A Study of the Change in Direction of Labor Movements under Japanese Rule”<\/strong><\/article>\n            <article><span>1988 · Social History 13<\/span><strong>“The Character and Development of Peasant Movements under the U.S. Military Government”<\/strong><\/article>\n          <\/div>\n          <p class=\"takeaway\">Agency widened to <b>workers and peasants<\/b>; explanation widened to <b>policy, organization, and process<\/b>.<\/p>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · 1980s","title":"All four terms <em>more than doubled<\/em><br>in the late 1980s","content":"\n          <div class=\"evidence-chart\" aria-label=\"Comparison of process policy labor and peasant shares across the 1980s\">\n            <div class=\"evidence-head\">\n              <span>Title concept<\/span>\n              <span class=\"evidence-legend\"><i class=\"legend-before\"><\/i>1981–1985 <i class=\"legend-after\"><\/i>1986–1990<\/span>\n              <span>per 10,000 concepts<\/span>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>과정 process<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:42.1%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:100%\"><\/span><\/div><b>14.3 → 33.9<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>정책 policy<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:26.3%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:59.1%\"><\/span><\/div><b>8.9 → 20.0<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>노동 labor<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:5.3%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:37.8%\"><\/span><\/div><b>1.8 → 12.8<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>농민 peasant<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:10.5%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:54.1%\"><\/span><\/div><b>3.6 → 18.4<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>17<\/span><span>34<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>Reading<\/span><strong>This was not one fashionable term: a <b>bundle of actors, policy, and process<\/b> rose together.<\/strong><\/div>\n          <p class=\"evidence-method\">1981–1985 N=4,949 · 1986–1990 N=6,540 · normalized concept share<\/p>\n        "},{"layout":"scale","eyebrow":"1990s","title":"Region, women, and international relations<br>became <em>new units of history<\/em>","content":"\n          <div class=\"scale-shift\">\n            <div class=\"scale-center\">nation · dynasty<\/div>\n            <div class=\"scale-rays\" aria-label=\"Expanded units of analysis\">\n              <span>region<\/span><span>residents<\/span><span>women<\/span><span>space<\/span><span>diplomacy<\/span><span>East Asia<\/span><span>diaspora<\/span>\n            <\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"rise-numbers\">\n            <span><b>region<\/b>12.5 → 47.8<\/span>\n            <span><b>culture<\/b>21.1 → 49.5<\/span>\n            <span><b>women<\/b>9.5 → 19.3<\/span>\n            <span><b>space<\/b>1.9 → 7.6<\/span>\n          <\/div>\n          <div class=\"era-paper-examples vertical compact\">\n            <article><span>1990 · Society and History 25<\/span><strong>“Women’s Labor Movements in the Colonial Period”<\/strong><\/article>\n            <article><span>1990 · Dongguk Historical Studies 24<\/span><strong>“The Establishment of Economic and Diplomatic Relations between Russia and Joseon”<\/strong><\/article>\n          <\/div>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · EARLY 1990s","title":"Region, culture, women, and space<br><em>rose together in the early 1990s<\/em>","content":"\n          <div class=\"evidence-chart\" aria-label=\"Comparison of region culture women and space shares around 1990\">\n            <div class=\"evidence-head\">\n              <span>Title concept<\/span>\n              <span class=\"evidence-legend\"><i class=\"legend-before\"><\/i>1986–1990 <i class=\"legend-after\"><\/i>1991–1995<\/span>\n              <span>per 10,000 concepts<\/span>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>지역 region<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:39.3%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:96.6%\"><\/span><\/div><b>19.5 → 47.8<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>문화 culture<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:51.7%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:100%\"><\/span><\/div><b>25.6 → 49.5<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>여성 women<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:21.3%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:38.9%\"><\/span><\/div><b>10.6 → 19.3<\/b>\n            <\/div>\n            <div class=\"stat-row\">\n              <strong>공간 space<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-before\" style=\"--w:6.7%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:15.3%\"><\/span><\/div><b>3.3 → 7.6<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>25<\/span><span>50<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>Reading<\/span><strong><b>Regions and social positions<\/b> became analytical units alongside nations and dynasties.<\/strong><\/div>\n          <p class=\"evidence-method\">1986–1990 N=6,540 · 1991–1995 N=8,760 · normalized concept share<\/p>\n        "},{"layout":"concept-sequence","eyebrow":"2000s","title":"How the past is <em>remembered and represented<\/em><br>became a research problem in its own right","content":"\n          <div class=\"concept-steps concept-steps-two\">\n            <section>\n              <span>2001–2005<\/span>\n              <strong>memory · identity<\/strong>\n              <p>How the past relates to collective identity<br>and textbook narratives<\/p>\n              <small><b>memory<\/b> 1 → 36 · <b>identity<\/b> 6 → 51 titles<\/small>\n            <\/section>\n            <i>→<\/i>\n            <section>\n              <span>2006–2010<\/span>\n              <strong>discourse · representation · space<\/strong>\n              <p>How the past is constructed through<br>empire, boundaries, and everyday life<\/p>\n              <small><b>discourse<\/b> 31 → 121 · <b>representation<\/b> 3 → 48<\/small>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <div class=\"era-paper-examples\">\n            <article><span>2001 · Korean National Movement History 27<\/span><strong>“Past Memory and Present Coexistence — Armed Anti-Japanese Struggle in Manchuria”<\/strong><\/article>\n            <article><span>2008 · Critical Studies on Modern Korean History 19<\/span><strong>“The Representation Called ‘Syngman Rhee’”<\/strong><\/article>\n          <\/div>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · 2000s","title":"The rise continued from memory and identity<br><em>toward discourse and representation<\/em>","content":"\n          <div class=\"evidence-chart\" aria-label=\"Normalized shares of memory identity discourse and representation from 1996 to 2010\">\n            <div class=\"evidence-head\">\n              <span>Title concept<\/span>\n              <span class=\"evidence-legend\"><i class=\"legend-first\"><\/i>1996–00 <i class=\"legend-mid\"><\/i>2001–05 <i class=\"legend-after\"><\/i>2006–10<\/span>\n              <span>per 10,000 concepts<\/span>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>기억 memory<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:1.6%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:43.2%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:72.3%\"><\/span><\/div><b>0.2 → 6.5 → 10.8<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>정체성 identity<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:9.8%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:61.1%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:55.1%\"><\/span><\/div><b>1.5 → 9.2 → 8.3<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>담론 discourse<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:31%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:37.2%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:99.4%\"><\/span><\/div><b>4.7 → 5.6 → 14.9<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>표상 representation<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:3.3%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:18%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:39.4%\              <span class=\"evidence-legend\"><i class=\"legend-first\"><\/i>2006–10 <i class=\"legend-mid\"><\/i>2011–15 <i class=\"legend-after\"><\/i>2016–20<\/span>\n              <span>per 10,000 concepts<\/span>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>기록 records<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:51.3%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:63.9%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:98.1%\"><\/span><\/div><b>15.9 → 19.8 → 30.4<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>일기 diaries<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:6.4%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:13.5%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:27.5%\"><\/span><\/div><b>2.0 → 4.2 → 8.5<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>냉전 Cold War<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:6.4%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:16.2%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:17.4%\"><\/span><\/div><b>2.0 → 5.0 → 5.4<\/b>\n            <\/div>\n            <div class=\"stat-row stat-triple\">\n              <strong>교과서 textbooks<\/strong><div class=\"stat-bars\"><span class=\"stat-bar is-first\" style=\"--w:65.6%\"><\/span><span class=\"stat-bar is-mid\" style=\"--w:76.2%\"><\/span><span class=\"stat-bar is-after\" style=\"--w:61.9%\"><\/span><\/div><b>20.3 → 23.6 → 19.2<\/b>\n            <\/div>\n            <div class=\"evidence-axis\"><span>0<\/span><span>15.5<\/span><span>31<\/span><\/div>\n          <\/div>\n        ","visual":"\n          <div class=\"evidence-takeaway\"><span>Reading<\/span><strong>Public questions persisted while <b>record-based reconstruction of experience<\/b> accumulated.<\/strong><\/div>\n          <p class=\"evidence-method\">2006–2010 N=15,740 · 2011–2015 N=15,229 · 2016–2020 N=15,099<\/p>\n        "},{"layout":"present-use","eyebrow":"2020s · OBSERVED 2021–2025","title":"The present-day use of the past<br>and <em>new forms of mediation<\/em> moved forward","content":"\n          <div class=\"three-columns present-columns\">\n            <section>\n              <span>Mediation of meaning<\/span>\n              <strong>narrative · representation<\/strong>\n              <p>How the past reaches the present<br>through stories and images<\/p>\n            <\/section>\n            <section>\n              <span>Bodies and objects<\/span>\n              <strong>materiality · medicine · health<\/strong>\n              <p>Bodies, objects, hospitals,<br>and institutional practice<\/p>\n            <\/section>\n            <section>\n              <span>Present value<\/span>\n              <strong>heritage · use · public history<\/strong>\n              <p>How the past is preserved, used,<br>and given public value<\/p>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <div class=\"era-paper-examples\">\n            <article><span>2023 · History and Reality 129<\/span><strong>“How We Should Approach Public History”<\/strong><\/article>\n            <article><span>2024 · Historical Research 49<\/span><strong>“Everyday Life in the Cold War through Materiality and the Senses”<\/strong><\/article>\n          <\/div>\n          <p class=\"caution\">2021–2025 is the latest observed, incomplete window.<\/p>\n        "},{"layout":"era-stats","eyebrow":"TEXT MINING EVIDENCE · 2021–2025","title":"Five terms for new mediation and present use<br><em>all moved upward<\/em>","content":"\n          <div class=\"evidence-chart evidence-chart-dense\" aria-label=\"Normalized shares of narrative materiality medicine heritage and public history from 2016 to 2025\">\n            <div class=\"evidence-head\">\n              <span>Title concept<\/span>\n · 2021–2025 N=17,770 · public history: 1 → 27 papers<\/p>\n        "},{"layout":"joseon","eyebrow":"SAME PAST, NEW QUESTIONS","title":"The same Joseon past was reread through<br><em>institutions, regions, and records<\/em>","content":"\n          <div class=\"joseon-compare\">\n            <section>\n              <span>Earlier relative center<\/span>\n              <strong>Toegye · Yulgok · Dasan<br>Silhak · political thought<\/strong>\n              <p>Who produced which body of thought?<\/p>\n            <\/section>\n            <i>→<\/i>\n            <section>\n              <span>Recent rise<\/span>\n              <strong>region · pattern · perception<br>operation · record · process<\/strong>\n              <p>How did institutions and local society operate and become recorded?<\/p>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <div class=\"confidence-strip\">\n            <span><b>pattern<\/b> +63.7 <small>95% +51.1 to +74.6<\/small><\/span>\n            <span><b>region<\/b> +48.1 <small>95% +37.6 to +58.9<\/small><\/span>\n            <span><b>perception<\/b> +42.3 <small>95% +30.7 to +55.1<\/small><\/span>\n          <\/div>\n          <p class=\"micro-note\">Median bootstrap change per 10,000 concepts. This is <b>redistribution of centrality<\/b>, not the disappearance of intellectual history.<\/p>\n        "},{"layout":"networks","eyebrow":"CO-OCCURRENCE","title":"Co-occurrence turns term frequency into<br><em>bundles of research questions<\/em>","content":"\n          <p class=\"deck-definition\">Co-occurrence = two terms appearing together in the same title<\/p>\n          <div class=\"network-row\">\n            <section class=\"mini-network net-80s\" aria-label=\"1980s co-occurrence\">\n              <b>1980s<\/b>\n              <svg class=\"network-svg\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Labor and peasants connected to movement; structure connected to character\">\n                <g class=\"svg-edges\"><line x1=\"54\" y1=\"38\" x2=\"150\" y2=\"75\"/><line x1=\"54\" y1=\"112\" x2=\"150\" y2=\"75\"/><line x1=\"242\" y1=\"38\" x2=\"242\" y2=\"112\"/><\/g>\n                <g class=\"svg-node\" transform=\"translate(54 38)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>labor<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(150 75)\"><rect x=\"-43\" y=\"-16\" width=\"86\" height=\"32\"/><text>movement<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(54 112)\"><rect x=\"-35\" y=\"-14\" width=\"70\" height=\"28\"/><text>peasant<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(242 38)\"><rect x=\"-38\" y=\"-14\" width=\"76\" height=\"28\"/><text>structure<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(242 112)\"><rect x=\"-38\" y=\"-14\" width=\"76\" height=\"28\"/><text>character<\/text><\/g>\n              <\/svg>\n            <\/section>\n            <section class=\"mini-network net-00s\" aria-label=\"2000s co-occurrence\">\n              <b>2000s<\/b>\n              <svg class=\"network-svg\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Memory connected to identity; discourse connected to representation and space\">\n                <g class=\"svg-edges\"><line x1=\"52\" y1=\"38\" x2=\"150\" y2=\"38\"/><line x1=\"52\" y1=\"112\" x2=\"156\" y2=\"112\"/><line x1=\"156\" y1=\"112\" x2=\"254\" y2=\"75\"/><\/g>\n                <g class=\"svg-node\" transform=\"translate(52 38)\"><rect x=\"-35\" y=\"-14\" width=\"70\" height=\"28\"/><text>memory<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(150 38)\"><rect x=\"-36\" y=\"-16\" width=\"72\" height=\"32\"/><text>identity<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(52 112)\"><rect x=\"-39\" y=\"-14\" width=\"78\" height=\"28\"/><text>discourse<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(156 112)\"><rect x=\"-53\" y=\"-16\" width=\"106\" height=\"32\"/><text>representation<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(254 75)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>space<\/text><\/g>\n              <\/svg>\n            <\/section>\n            <section class=\"mini-network net-20s\" aria-label=\"2021–2025 co-occurrence\">\n              <b>2021–2025<\/b>\n              <svg class=\"network-svg\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Public, history, narrative, sources, and implications form a connected bundle\">\n                <g class=\"svg-edges\"><line x1=\"48\" y1=\"38\" x2=\"140\" y2=\"38\"/><line x1=\"140\" y1=\"38\" x2=\"246\" y2=\"75\"/><line x1=\"76\" y1=\"116\" x2=\"205\" y2=\"116\"/><line x1=\"205\" y1=\"116\" x2=\"246\" y2=\"75\"/><\/g>\n                <g class=\"svg-node\" transform=\"translate(48 38)\"><rect x=\"-31\" y=\"-14\" width=\"62\" height=\"28\"/><text>public<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(140 38)\"><rect x=\"-33\" y=\"-16\" width=\"66\" height=\"32\"/><text>history<\/text><\/g>\n                <g class=\"svg-node hub\" transform=\"translate(246 75)\"><rect x=\"-42\" y=\"-16\" width=\"84\" height=\"32\"/><text>narrative<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(76 116)\"><rect x=\"-35\" y=\"-14\" width=\"70\" height=\"28\"/><text>sources<\/text><\/g>\n                <g class=\"svg-node\" transform=\"translate(205 116)\"><rect x=\"-48\" y=\"-14\" width=\"96\" height=\"28\"/><text>implications<\/text><\/g>\n              <\/svg>\n            <\/section>\n          <\/div>\n        ","visual":"\n          <p class=\"takeaway\">Frequency shows <b>how much attention<\/b> a term receives;<br>co-occurrence shows <b>how that attention is organized into a question<\/b>.<\/p>\n          <div class=\"pair-stat\"><b>8,258 pairs<\/b> tested <i>→<\/i> <strong>329<\/strong> met significance and effect thresholds<\/div>\n        "},{"layout":"robustness","eyebrow":"ROBUSTNESS","title":"<em>How much confidence<\/em> can we place in these findings?","content":"\n          <div class=\"validation-ladder\">\n            <span><b>01<\/b> normalize volume and title length<\/span>\n            <span><b>02<\/b> compare five- and ten-year windows<\/span>\n            <span><b>03<\/b> retain the same journals in both periods<\/span>\n            <span><b>04<\/b> resample equal-sized sets 300 times<\/span>\n            <span><b>05<\/b> flag journal concentration<\/span>\n            <span><b>06<\/b> rerun after excluding North Korean publications<\/span>\n          <\/div>\n        ","visual":"\n          <div class=\"robust-funnel\">\n            <div><strong>384<\/strong><span>candidate changes<\/span><\/div>\n            <i>→<\/i>\n            <div><strong>214<\/strong><span>direction-consistent<\/span><\/div>\n            <i>→<\/i>\n            <div class=\"funnel-accent\"><strong>50<\/strong><span>strictly robust<\/span><\/div>\n          <\/div>\n          <div class=\"robust-explain\">\n            <section><span>300 bootstrap repetitions<\/span><strong>Match the two periods’ sample sizes,<br>then resample with replacement 300 times<\/strong><\/section>\n            <section><span>54 / 63<\/span><strong>Bursts that also increased within journals<br>present in both adjacent periods<\/strong><\/section>\n          <\/div>\n          <div class=\"correction\">\n            <span><b>Removed<\/b> people–struggle–revolution · leader–Kim Il Sung–wise<\/span>\n            <span><b>Persisted<\/b> labor·region · memory·representation · narrative·medicine·heritage<\/span>\n          <\/div>\n        "},{"layout":"synthesis","eyebrow":"SYNTHESIS · THE FIELD’S SENSE OF ITS TIME","title":"The field’s sense of its time expanded<br>from <em>identifying objects<\/em> to asking<br>how the past <em>operates and is used now<\/em>","content":"\n          <div class=\"synthesis-flow\">\n            <section><span>1970s<\/span><strong>Identify objects<\/strong><p>Study dynasties, figures,<br>and thought<\/p><\/section>\n            <i>→<\/i>\n            <section><span>1980s–1990s<\/span><strong>Actors and structures<\/strong><p>Groups, institutions, regions,<br>women, and international relations<\/p><\/section>\n            <i>→<\/i>\n            <section><span>2000s–2010s<\/span><strong>Memory and experience<\/strong><p>How discourse, representation,<br>education, and records mediate the past<\/p><\/section>\n            <i>→<\/i>\n            <section><span>2020s<\/span><strong>Present-day use<\/strong><p>How narrative, materiality, heritage,<br>and public history create value<\/p><\/section>\n          <\/div>\n        ","visual":"\n          <p class=\"synthesis-conclusion\">From reconstructing what happened<br>to asking <b>who experiences, remembers, represents, and uses the past—and how<\/b>.<\/p>\n        "},{"layout":"closing","eyebrow":"CONCLUSION","title":"Distant reading reveals<br><em>the present’s way of seeing the past<\/em>","content":"\n          <blockquote class=\"closing-thesis\">\n            Historical scholarship expanded<br>\n            <span>from asking “what happened in the past?”<\/span><br>\n            <strong>to asking how the past is experienced, remembered, represented,<br>and put to use in the present.<\/strong>\n          <\/blockquote>\n        ","visual":"\n          <div class=\"limits\">\n            <span>Titles compress publicly stated research problems<\/span>\n            <span>Frequency and co-occurrence do not prove social causation<\/span>\n            <span>Early-1970s coverage and the incomplete 2020s require caution<\/span>\n          <\/div>\n          <p class=\"final-line\">Distant reading does not replace individual papers.<br><b>It shows which questions became possible—and where to read closely again.<\/b><\/p>\n        "}]}};
